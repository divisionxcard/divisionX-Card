name: WorldWide Stock Sync

on:
  schedule:
    # รันทุกวัน เวลา 00:15 น. ไทย (17:15 UTC วันก่อน)
    - cron: "15 17 * * *"
    # รอบเช้า 09:10 น. ไทย (02:10 UTC) — จับการเติมข้ามคืน
    # ⚠️ GitHub cron เลื่อนจริงเป็นชั่วโมง มักลงหลังห้างเปิด → window ไม่สะอาด
    #    ต้องพึ่ง step ดึงยอดขายก่อนข้างล่างแทน
    - cron: "10 2 * * *"
    # รอบค่ำ 21:00 น. ไทย (14:00 UTC) — เพิ่ม 31 ส.ค. 2026 ตามที่เจ้าของขอ
    #
    # ทำไมต้องมี: เดิมมีแค่ 2 รอบ และรอบเช้าลงจริงสาย 1-6 ชม.
    #   (วัด 14 วัน: ตั้งไว้ 09:10 แต่ลงจริง 10:xx(10) 11:xx(2) 13:xx(1) 15:xx(3))
    #   ช่วงบ่าย-ค่ำจึงเป็นช่วงที่หน้าเว็บยังโชว์ตัวเลข "ก่อนเติม" ของตู้ที่เติมไปแล้ว
    #   ใครทำใบจัดของช่วงนั้นจะเห็นช่องว่างเต็ม ๆ แล้วจัดของไปซ้ำ
    #
    # ⚠️ รอบนี้จงใจตั้งก่อนห้างปิด (ปิด ~22:00) เพราะ cron เลื่อนได้เป็นชั่วโมง
    #    ตั้ง 22:00 แล้วเลื่อนไป 01:00 จะซ้ำกับรอบ 00:15 เปล่า ๆ
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase beautifulsoup4

      # ── ยอดขายก่อน แล้วค่อยสต็อก ─────────────────────────────────────
      # slot_tracking คำนวณ qty_added = (after − before) + sold_between โดยอ่าน sales
      # *ตอนนี้* → ถ้ายอดขายยังไม่เข้า DB จะได้ sold_between = 0 → qty_added ต่ำกว่าจริง
      # รอบเช้าโดนเต็ม ๆ เพราะ GitHub cron เลื่อนไปรันหลังห้างเปิด
      # ดึง 2 วัน (เมื่อวาน+วันนี้ เวลาไทย) กันรอบดึกที่ข้ามเที่ยงคืน · sales upsert ซ้ำได้
      - name: Sync ยอดขายล่าสุดก่อน (ให้ sold_between ถูกต้อง)
        continue-on-error: true   # ล้มได้ ไม่ให้ฉุดงานหลัก — สต็อกสำคัญกว่า
        env:
          WW_USERNAME:            ${{ secrets.WW_USERNAME }}
          WW_PASSWORD:            ${{ secrets.WW_PASSWORD }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%F)
          YDAY=$(TZ=Asia/Bangkok date -d 'yesterday' +%F)
          echo "🗓  ยอดขาย $YDAY → $TODAY (เวลาไทย)"
          python deploy/scraper/worldwide_sales_api.py --from-date "$YDAY" --to-date "$TODAY"

      - name: Sync WorldWide Stock
        env:
          WW_USERNAME:            ${{ secrets.WW_USERNAME }}
          WW_PASSWORD:            ${{ secrets.WW_PASSWORD }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: python deploy/scraper/worldwide_stock_sync.py

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_OWNER_CHAT_ID\",\"parse_mode\":\"HTML\",\"text\":\"🚨 <b>Cron Scraper FAIL</b>\\n\\nJob: <code>WorldWide Stock Sync</code>\\n<a href=\\\"$RUN_URL\\\">ดู log บน GitHub</a>\"}"
          fi
