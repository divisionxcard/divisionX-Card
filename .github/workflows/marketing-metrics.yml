name: Marketing Post Metrics

# เก็บผลลัพธ์ของโพสต์บนเพจ (ไลก์ · คอมเมนต์ · แชร์) เป็นสแนปช็อตทุก 6 ชม.
#
# ทำไมต้องหลายรอบต่อวัน ไม่ใช่วันละครั้ง: เอนเกจโตไม่เท่ากันตามเวลา
# เก็บหลายจุดแล้วจะเทียบได้ว่า "24 ชม.แรกได้เท่าไหร่" ซึ่งยุติธรรมกับทุกโพสต์
#
# รันบนคลาวด์เพราะต้องเก็บต่อเนื่องแม้คอมที่บ้านปิด (Hermes ทำหน้าที่วิเคราะห์ ไม่ใช่เก็บ)
# ใช้ secret เดียวกับตัวตั้งเวลาโพสต์ — เป็นงานเบื้องหลังชุดเดียวกัน

on:
  schedule:
    # 6 ชม./ครั้ง — 03:00 09:00 15:00 21:00 เวลาไทย (UTC-7)
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: ดึงตัวเลขจากเพจมาเก็บ
        env:
          SECRET: ${{ secrets.AUTOPOST_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "ยังไม่ได้ตั้ง secret AUTOPOST_SECRET — ข้ามรอบนี้"
            exit 0
          fi
          out=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $SECRET" \
            "https://division-x-card.vercel.app/api/marketing/metrics-collect")
          code=$(echo "$out" | tail -1)
          json=$(echo "$out" | sed '$d')
          echo "HTTP $code"
          echo "$json"

          # 503 = ยังไม่เปิดใช้ (ไม่มี secret ฝั่ง Vercel / ยังไม่ตั้ง FB) — ไม่ใช่ความล้มเหลว
          [ "$code" = "503" ] && { echo "ปลายทางยังไม่พร้อม"; exit 0; }

          # 502 = อ่านเพจไม่ได้ ซึ่งเกือบทุกครั้งคือ token ตาย — ต้องดังพอให้เห็น
          if [ "$code" = "502" ]; then
            echo "::error::อ่านข้อมูลจากเพจ Facebook ไม่ได้ — น่าจะ token ตาย ดูวิธีกู้ใน wiki/marketing/auto-posting-level3-setup.md"
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::metrics-collect ตอบ HTTP $code"; exit 1; }

          collected=$(echo "$json" | sed -n 's/.*"collected":\([0-9]*\).*/\1/p')
          [ "$collected" = "0" ] && echo "::warning::ไม่พบโพสต์บนเพจให้เก็บเลย — ผิดปกติถ้าเพจมีโพสต์อยู่"
