name: Vendos Stock Sync

# ⚠️ เฟสทดสอบ: ยังเป็น manual (workflow_dispatch) เท่านั้น — ไม่มี cron
# กด Run workflow เพื่อทดสอบ --dry-run (login+fetch+parse · ไม่บันทึก DB)
# พอ dry-run ผ่าน + เพิ่มตู้ใน machines แล้ว ค่อยเพิ่ม schedule + เปลี่ยนเป็น live
on:
  workflow_dispatch:
    inputs:
      shop_id:
        description: "Vendos shop id ที่จะทดสอบ (dry-run)"
        required: false
        default: "208"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Vendos Stock Sync (dry-run)
        env:
          VENDOS_USERNAME:      ${{ secrets.VENDOS_USERNAME }}
          VENDOS_PASSWORD:      ${{ secrets.VENDOS_PASSWORD }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python deploy/scraper/vendos_stock_sync.py --dry-run --shop-id "${{ inputs.shop_id }}"
