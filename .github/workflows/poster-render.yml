name: Render Content Poster

# สร้างโปสเตอร์คอนเทนต์ด้วย Chromium จริง
#
# ทำไมต้องรันที่นี่ ไม่ใช่บน Vercel:
#   ตัวอักษรไทยต้องใช้ text shaping ของเบราว์เซอร์จริง — next/og (Satori)
#   ทิ้งวรรณยุกต์เมื่อซ้อนบนสระบน ("ที่" กลายเป็น "ที") ทดสอบยืนยันแล้ว
#   ดู wiki/worklog/2026-08-08-thai-text-rendering.md
#
# เจ้าของเลือกทางนี้เองเพราะ "อยากได้ภาพที่ถูกต้องที่สุด เวลารอไม่ใช่ปัญหา"

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "id ของ marketing_content ที่จะสร้างโปสเตอร์"
        required: true
        type: string
      sku:
        description: "บังคับ SKU ที่จะเอารูปมาใช้ (เว้นว่าง = ใช้ source_sku ของคอนเทนต์)"
        required: false
        type: string
      # ซีรีส์ "ส่อง 5 ใบเด็ด" (10 ต.ค. 2026) — เทมเพลตวางการ์ดจริง 5 ใบ (deploy/agents/top5_poster.py)
      template:
        description: "เทมเพลตพิเศษ (top5 = ส่อง 5 ใบเด็ด · เว้นว่าง = โปสเตอร์ปกติ)"
        required: false
        type: string
      bg:
        description: "url พื้นหลังจาก AI ใน /marketing/aibg/ (ใช้กับ template=top5)"
        required: false
        type: string

# สิทธิ์ของ GITHUB_TOKEN ในงานนี้: อ่านโค้ดอย่างเดียว (งานนี้ไม่ push อะไรกลับ)
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --with-deps ลง system library ที่ chromium ต้องใช้บน ubuntu ด้วย
      # ขาดตัวใดตัวหนึ่งแล้ว browser จะเปิดไม่ขึ้นโดยไม่มี error ที่อ่านรู้เรื่อง
      #
      # ⚠️ ห้ามปักหมุด 1.44.0 ตาม deploy/scraper/requirements.txt
      # รุ่นนั้นสั่งลง libasound2 ซึ่ง Ubuntu 24.04 (noble) เปลี่ยนชื่อเป็น libasound2t64 แล้ว
      # → "Package 'libasound2' has no installation candidate" แล้วล้มทั้ง job
      # (รัน #1 #2 ตายด้วยเหตุนี้) · vms-sync.yml รอดเพราะลงแบบไม่ระบุเวอร์ชัน
      # ใช้เป็นขั้นต่ำแทนการปักหมุด — ได้ของที่แก้ปัญหานี้แล้วและยังอัปเดตตามได้
      - name: Install Playwright + Chromium
        run: |
          pip install "playwright>=1.49"
          playwright install --with-deps chromium

      # ซีรีส์ 5 ใบเด็ด — รับค่าผ่าน env ไม่ใช่แทนลงคำสั่งตรง ๆ (ค่า bg เป็น url จากภายนอก
      # ถ้าแทนลงในคำสั่งแล้วรันด้วย eval เครื่องหมายแปลก ๆ ในค่าจะกลายเป็นคำสั่ง shell ได้)
      - name: Render top5 poster
        if: ${{ github.event.inputs.template == 'top5' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # โปสเตอร์/ฉาก AI อยู่คลังไฟล์ Cloudflare R2 (agents/r2.py · 23 ต.ค. 2026)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CONTENT_ID: ${{ github.event.inputs.content_id }}
          BG_URL: ${{ github.event.inputs.bg }}
        run: |
          case "$CONTENT_ID" in ''|*[!0-9]*) echo "content_id ต้องเป็นตัวเลข"; exit 1 ;; esac
          cd deploy/agents
          if [ -n "$BG_URL" ]; then
            python top5_poster.py --id "$CONTENT_ID" --bg "$BG_URL"
          else
            python top5_poster.py --id "$CONTENT_ID"
          fi

      - name: Render poster
        if: ${{ github.event.inputs.template != 'top5' }}
        # ⚠️ รับค่าผ่าน env + ตรวจรูปแบบก่อนใช้ ห้ามแทน ${{ inputs }} ลงในคำสั่งตรง ๆ แล้ว eval
        #    (ตรวจความปลอดภัย 16 ต.ค. 2026: เดิม sku ที่ส่งมาจากหน้าเว็บถูกต่อเป็นสตริงคำสั่งแล้ว eval
        #     บนเครื่องที่ถือ SUPABASE_SERVICE_KEY — ใส่ ' ; คำสั่ง ; ' แทน sku ก็รันคำสั่งเองได้)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # โปสเตอร์/ฉาก AI อยู่คลังไฟล์ Cloudflare R2 (agents/r2.py · 23 ต.ค. 2026)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CONTENT_ID: ${{ github.event.inputs.content_id }}
          SKU: ${{ github.event.inputs.sku }}
        run: |
          case "$CONTENT_ID" in
            ''|*[!0-9]*) echo "::error::content_id ต้องเป็นตัวเลข"; exit 1 ;;
          esac
          ARGS=(--id "$CONTENT_ID")
          if [ -n "$SKU" ]; then
            if ! printf '%s' "$SKU" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,39}$'; then
              echo "::error::sku มีอักขระที่ไม่รองรับ"; exit 1
            fi
            ARGS+=(--sku "$SKU")
          fi
          python deploy/agents/poster_render.py "${ARGS[@]}"

      # เก็บไฟล์ไว้ให้ดาวน์โหลดดูได้ด้วย เผื่อภาพออกมาเพี้ยนจะได้ตรวจย้อนหลัง
      # โดยไม่ต้องไปรื้อ Storage
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-${{ github.event.inputs.content_id }}
          path: deploy/agents/poster-*.png
          if-no-files-found: ignore
          retention-days: 7
