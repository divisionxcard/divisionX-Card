name: Weekly Backup

on:
  # ปิดตารางเวลา 17 ต.ค. 2026 — สำรองข้อมูลย้ายไปบอทในเครื่องแล้ว (scripts/telegram_sync_bot.py · /backup · ทุก 7 วัน เก็บ 8 ชุด)
  # รีโปเป็นสาธารณะ: artifact ของงานนี้ (ยอดขาย เคลม ต้นทุน) ใครมีบัญชี GitHub ก็โหลดได้ 90 วัน
  # และหน้า /privacy เขียนว่าไฟล์สำรองเก็บในเครื่องร้าน → อย่าเปิดตารางเวลากลับ ถ้า repo ยังไม่เป็น private
  # (ตารางเดิม: ทุกวันอาทิตย์ 00:05 น. ไทย = cron "5 17 * * 6" · 5 รอบล่าสุด 15 ส.ค.–10 ต.ค. ล้มทุกรอบ)
  workflow_dispatch:  # กดรันเองได้

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: deploy
        run: npm install --no-audit --no-fund @supabase/supabase-js

      - name: Run backup script
        working-directory: deploy
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backup-tables.js

      - name: Generate timestamp
        id: ts
        run: echo "stamp=$(date -u +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.ts.outputs.stamp }}
          path: deploy/backups/
          retention-days: 90  # เก็บ 90 วัน (quota 500 MB ครอบคลุมสบาย)
          if-no-files-found: error
