name: Payif Stock Sync

# ยี่ห้อตู้ Payif (ผ่าน Vendos portal API) — ดึงสต็อกหน้าตู้เข้า machine_stock
# อ่านตู้จาก machines (brand='payif') · sync ทุกตู้อัตโนมัติเมื่อเพิ่มตู้ใหม่
on:
  schedule:
    # ดึก 00:20 น. ไทย (17:20 UTC วันก่อน)
    - cron: "20 17 * * *"
    # เช้า 09:20 น. ไทย (02:20 UTC) — จับการเติมข้ามคืน
    # ⚠️ GitHub cron เลื่อนจริงเป็นชั่วโมง มักลงหลังห้างเปิด → ต้องพึ่ง step ดึงยอดขายก่อนข้างล่าง
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      # ── ยอดขายก่อน แล้วค่อยสต็อก ─────────────────────────────────────
      # slot_tracking คำนวณ qty_added = (after − before) + sold_between โดยอ่าน sales
      # *ตอนนี้* → ถ้ายอดขายยังไม่เข้า DB จะได้ sold_between = 0 → qty_added ต่ำกว่าจริง
      # รอบเช้าโดนเต็ม ๆ เพราะ GitHub cron เลื่อนไปรันหลังห้างเปิด
      # ดึง 2 วัน (เมื่อวาน+วันนี้ เวลาไทย) กันรอบดึกที่ข้ามเที่ยงคืน · sales upsert ซ้ำได้
      - name: Sync ยอดขายล่าสุดก่อน (ให้ sold_between ถูกต้อง)
        continue-on-error: true   # ล้มได้ ไม่ให้ฉุดงานหลัก — สต็อกสำคัญกว่า
        env:
          VENDOS_USERNAME:      ${{ secrets.VENDOS_USERNAME }}
          VENDOS_PASSWORD:      ${{ secrets.VENDOS_PASSWORD }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: deploy/scraper
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%F)
          YDAY=$(TZ=Asia/Bangkok date -d 'yesterday' +%F)
          echo "🗓  ยอดขาย $YDAY → $TODAY (เวลาไทย)"
          python payif_sales_sync.py --from-date "$YDAY" --to-date "$TODAY"

      - name: Payif Stock Sync
        env:
          VENDOS_USERNAME:      ${{ secrets.VENDOS_USERNAME }}
          VENDOS_PASSWORD:      ${{ secrets.VENDOS_PASSWORD }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ต้องมี 2 ตัวนี้ ไม่งั้นการแจ้งเตือน "เปลี่ยนสินค้าหน้าตู้" เงียบ
          # (worldwide-stock-sync.yml ส่งไว้อยู่แล้ว ขาดแค่ไฟล์นี้)
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python deploy/scraper/payif_stock_sync.py

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_OWNER_CHAT_ID\",\"parse_mode\":\"HTML\",\"text\":\"🚨 <b>Cron Scraper FAIL</b>\\n\\nJob: <code>Payif Stock Sync</code>\\n<a href=\\\"$RUN_URL\\\">ดู log บน GitHub</a>\"}"
          fi
