<!doctype html>
<!--
  scaffold/captions.template.html — ซับไทยทั้งคลิปในฉากย่อยเดียว (hf_render.py เติม {{...}} แล้วเขียนเป็น compositions/captions.html)
  แยกออกจาก index.html ตามข้อแนะนำ HyperFrames: แทร็กซับแน่น ๆ อยู่ในไฟล์ของมันเอง แก้/เทียบ diff ง่าย
  ตำแหน่ง: กึ่งกลางล่าง top 1330px — เหนือแถบปุ่มของ TikTok/Reels · ตัวหนา Kanit + ขอบกรมท่า อ่านได้บนรูปทุกแบบ
  คำเด็ด (.hot) สีทอง · ชื่อแบรนด์/ชุด (.hl) ฟ้านีออน
-->
<html lang="th">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-ExtraBold.ttf"); font-weight: 800; }
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; font-family: "Kanit", sans-serif; }
        .cap { position: absolute; left: 70px; right: 70px; top: 1330px; display: flex; justify-content: center; }
        .cap-text {
          display: block; max-width: 940px; text-align: center;
          font-weight: 800; font-size: 74px; line-height: 1.25; color: #ffffff;
          -webkit-text-stroke: 12px #03102a; paint-order: stroke fill;
          text-shadow: 0 0 26px rgba(3, 16, 42, 0.9), 0 6px 0 #03102a;
          will-change: transform, opacity;
        }
        .cap-text .hl { color: #59d2ff; }
        .cap-text .hot { color: var(--hot, #ffc24a); }   /* สีเน้นของชุดหน้าตา (ตั้งที่ slot ใน index.html) */
      </style>

      <div data-hf-id="hf-3147" id="root" data-composition-id="captions" data-width="1080" data-height="1920">
{{CAPTIONS}}
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // ซับแต่ละท่อนเด้งขึ้นตอนเริ่มพูด — ท่อนเป็น clip ของ runtime จึง tween เฉพาะตัวลูก (.cap-text)
          document.querySelectorAll("#root .cap").forEach((cap) => {
            const s = Number(cap.getAttribute("data-start"));
            tl.fromTo(
              cap.querySelector(".cap-text"),
              { scale: 0.86, y: 18, opacity: 0 },
              { scale: 1, y: 0, opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: false },
              s,
            );
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
