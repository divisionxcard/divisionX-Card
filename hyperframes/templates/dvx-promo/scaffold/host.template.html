<!doctype html>
<!--
  scaffold/host.template.html — โครงหลักที่ deploy/agents/video/hf_render.py เติมแล้วเขียนเป็น index.html ของแต่ละงาน
  ห้ามเปิดไฟล์นี้ตรง ๆ ใน Studio (มีตัวยึด {{...}}) — เปิด index.html (ตัวอย่างที่สร้างจากแผนเดโม) แทน

  ชั้นภาพ (ล่าง → บน):
    พื้นกรมท่า + แสงเรือง + ลายพื้นหลัง (ตามชุดหน้าตา) + ตัวหนังสือจาง (ตลอดคลิป)
    ฉาก (sub-composition) ตามเวลาที่ whisper จับจากเสียงจริง
    ฉากเปลี่ยนตรงรอยต่อ (ตามชุดหน้าตา)
    โลโก้มุมขวาบน · ซับไทย (Chromium วาด — สระ/วรรณยุกต์ถูกเสมอ)
  เสียง: เสียงพากย์ Gemini จากโรงงานเดิม (ไม่มีเพลง จนกว่าจะมีเพลงที่มีใบอนุญาตในคลัง music.py)

  ชุดหน้าตา (look · 16 ต.ค. 2026 — เจ้าของ: "อยากให้ระบบออกแบบได้อิสระ ไม่จำเจ"):
    {{BG}}   ลายพื้นหลัง   grid ตาราง · dots จุดฮาล์ฟโทน · rays ลำแสงหมุน · speed เส้นสปีดแบบมังงะ
    {{CUT}}  ฉากเปลี่ยน     bolt สายฟ้า · flash แสงวาบ+วงคลื่น · glitch แถบสัญญาณกระตุก · wipe แถบนีออนกวาด
    ts-*     หัวเรื่อง       stroke ขอบหนา (เดิม) · chrome โครเมียม · neon นีออน — คลาสอยู่ที่ slot ของแต่ละฉาก
    --hot    สีเน้น         ตั้งที่ slot (คำถามบรรทัด 2 + คำเด็ดในซับ) — ฉากย่อยอยู่ใน DOM เดียวกัน CSS/ตัวแปรจึงไหลถึง
  ทุกแบบยังอยู่ในโทนแบรนด์ (ฟ้านีออน + สายฟ้า + โครเมียม บนกรมท่า) — ต่างกันที่ลาย/จังหวะ ไม่ใช่เปลี่ยนแบรนด์
-->
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-Black.ttf"); font-weight: 900; }
      @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-ExtraBold.ttf"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #03102a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Kanit", sans-serif; }
      #bg { position: absolute; inset: 0; background: #03102a; }
      .bg-glow { position: absolute; border-radius: 50%; will-change: transform, opacity; }
      #bg-glow-a { left: -260px; top: -200px; width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(27, 141, 255, 0.42), rgba(3, 16, 42, 0) 68%); }
      #bg-glow-b { left: 260px; top: 980px; width: 1200px; height: 1200px; background: radial-gradient(circle, rgba(89, 210, 255, 0.3), rgba(3, 16, 42, 0) 66%); }
      /* ── ลายพื้นหลัง: มีครบทุกแบบใน DOM แสดงแบบเดียวตาม data-bg (display ตั้งใน CSS ไม่ได้ tween) */
      .bgv { position: absolute; display: none; pointer-events: none; will-change: transform, opacity; }
      #bg[data-bg="grid"] .bgv-grid, #bg[data-bg="dots"] .bgv-dots, #bg[data-bg="rays"] .bgv-rays, #bg[data-bg="speed"] .bgv-speed { display: block; }
      #bg-grid {
        inset: -120px;
        background-image: linear-gradient(rgba(89, 210, 255, 0.13) 2px, transparent 2px), linear-gradient(90deg, rgba(89, 210, 255, 0.13) 2px, transparent 2px);
        background-size: 120px 120px;
      }
      #bg-dots {
        inset: -80px;
        background-image: radial-gradient(circle, rgba(89, 210, 255, 0.26) 3.2px, transparent 3.8px);
        background-size: 44px 44px;
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0.9));
      }
      #bg-rays {
        left: -760px; top: -560px; width: 2600px; height: 2600px;
        background: repeating-conic-gradient(from 0deg, rgba(89, 210, 255, 0.13) 0deg 6deg, rgba(3, 16, 42, 0) 6deg 17deg);
        -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.55) 32%, rgba(0, 0, 0, 0) 62%);
      }
      #bg-speed {
        left: -760px; top: -380px; width: 2600px; height: 2600px;
        background: repeating-conic-gradient(from 0deg, rgba(232, 247, 255, 0.17) 0deg 0.9deg, rgba(3, 16, 42, 0) 0.9deg 5.2deg);
        -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 0) 17%, rgba(0, 0, 0, 0.85) 42%, rgba(0, 0, 0, 1) 60%);
      }
      #bg-ghost {
        position: absolute; left: -40px; top: 700px; width: 2400px;
        font-weight: 900; font-size: 330px; line-height: 1; letter-spacing: 0.04em;
        color: rgba(89, 210, 255, 0.11); white-space: nowrap; will-change: transform;
      }
      /* ตัวหนังสือจางเป็นของตกแต่ง — วางเป็น ::before ไม่ให้นับเป็นข้อความที่ต้องอ่านออก (contrast audit) */
      #bg-ghost::before { content: "DIVISION X · CARD · DIVISION X · CARD"; }
      /* ── ชั้นซ้อน: ฉาก (1) < เอฟเฟกต์ตัดฉาก (20) < โลโก้ (30) < ซับ (40)
         ฉากรูปแบบใช้ z-index 2–8 ข้างใน — ถ้าช่องฉากไม่แยกชั้น ชิ้นพวกนั้นลอยข้ามขึ้นมาทับทุกอย่าง
         (เจอในคลิปพิกัดตู้บน Actions: พื้นเบลอของการ์ดรูปตู้ z 5 บังซับ+โลโก้ทั้งช่วง ~4 วิ และบังแถบกวาดขาเข้า) */
      .scene-slot { position: absolute; inset: 0; z-index: 1; }
      #fx-flash, #fx-ring, #fx-glitch, #fx-wipe, #fx-cover, #fx-bolts { z-index: 20; }
      #fx-glitch { position: absolute; inset: 0; pointer-events: none; }
      #corner-logo { z-index: 30; }
      #captions-slot { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
      /* ── ฉากเปลี่ยน */
      #fx-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(235, 248, 255, 0.95), rgba(89, 210, 255, 0.55) 45%, rgba(27, 141, 255, 0) 80%); opacity: 0; pointer-events: none; }
      #fx-bolts { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }
      .bolt { fill: none; stroke: #e8f7ff; stroke-width: 12; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 18px #59d2ff) drop-shadow(0 0 40px #1b8dff); opacity: 0; }
      #fx-ring { position: absolute; left: 540px; top: 860px; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; border: 16px solid #e8f7ff; box-shadow: 0 0 60px #59d2ff, inset 0 0 50px #1b8dff; opacity: 0; pointer-events: none; }
      .fx-g { position: absolute; left: -40px; width: 1160px; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
      /* แถบกวาด: เปิดคลิป = แสงกวาดโปร่ง (#fx-wipe) · รอยตัดฉาก = แถบทึบปิดเต็มจอตรงวินาทีที่ฉากสลับ แล้วเผยฉากใหม่ (#fx-cover)
         สูงเกินจอทั้งคู่ — เอียงแล้วขอบบน/ล่างห้ามโผล่ในเฟรม (เดิมสูง 1200 เห็นเป็นกล่องลอย) */
      #fx-wipe { position: absolute; left: 0; top: -700px; width: 1400px; height: 3320px; opacity: 0; pointer-events: none;
        background: linear-gradient(90deg, rgba(27, 141, 255, 0) 0%, rgba(27, 141, 255, 0.55) 32%, rgba(232, 247, 255, 0.9) 50%, rgba(89, 210, 255, 0.55) 68%, rgba(27, 141, 255, 0) 100%); }
      #fx-cover { position: absolute; left: 0; top: -700px; width: 2200px; height: 3320px; opacity: 0; pointer-events: none;
        background:
          repeating-linear-gradient(90deg, rgba(89, 210, 255, 0.07) 0 5px, rgba(89, 210, 255, 0) 5px 64px),
          linear-gradient(90deg, rgba(89, 210, 255, 0) 0, rgba(232, 247, 255, 0.95) 40px, #59d2ff 70px, #1b8dff 96px, #0a2a6b 170px, #061a45 50%,
            #0a2a6b calc(100% - 170px), #1b8dff calc(100% - 96px), #59d2ff calc(100% - 70px), rgba(232, 247, 255, 0.95) calc(100% - 40px), rgba(89, 210, 255, 0) 100%); }
      #corner-logo { position: absolute; right: 44px; top: 54px; width: 150px; height: 128px; object-fit: contain; opacity: 0.92; filter: drop-shadow(0 0 14px rgba(27, 141, 255, 0.6)); }

      /* ── หัวเรื่องของฉากรูปแบบ (.dvx-q1/.dvx-q2 ในฉากย่อย) — คลาส ts-* อยู่ที่ slot · stroke = ค่าเดิมในฉาก ไม่ต้องมีกฎ
         ⚠️ ห้ามใส่ filter บน .dvx-q — ฉากย่อย tween filter (blur ตอนกระแทกเข้า) ทับกันแล้วแสงหาย · ใส่ที่ .dvx-head แทน */
      .ts-chrome .dvx-q {
        color: transparent !important; -webkit-text-stroke: 0 !important; text-shadow: none !important;
        background: linear-gradient(180deg, #ffffff 0%, #e3eef9 38%, #7f9bb8 56%, #f4f9ff 78%, #ffffff 100%);
        -webkit-background-clip: text; background-clip: text;
      }
      .ts-chrome .dvx-q2 { background: linear-gradient(180deg, #ffffff 0%, var(--hot, #ffc24a) 40%, color-mix(in srgb, var(--hot, #ffc24a) 55%, #2a1a00) 58%, var(--hot, #ffc24a) 80%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; }
      .ts-chrome .dvx-head { filter: drop-shadow(0 7px 0 #03102a) drop-shadow(0 0 22px rgba(27, 141, 255, 0.6)); }
      .ts-neon .dvx-q { -webkit-text-stroke: 0 !important; color: #f2fbff !important; text-shadow: 0 0 10px #59d2ff, 0 0 28px #1b8dff, 0 0 60px rgba(27, 141, 255, 0.85) !important; }
      .ts-neon .dvx-q2 { color: var(--hot, #ffc24a) !important; text-shadow: 0 0 10px var(--hot, #ffc24a), 0 0 30px var(--hot, #ffc24a), 0 0 64px rgba(255, 255, 255, 0.35) !important; }
      .ts-neon .dvx-kick { background: rgba(3, 16, 42, 0.9) !important; border: 3px solid #59d2ff; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-4607" id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <div data-hf-id="hf-2xc0" id="bg" data-bg="{{BG}}">
        <div data-hf-id="hf-bl0m" class="bg-glow" id="bg-glow-a"></div>
        <div data-hf-id="hf-7mwl" class="bg-glow" id="bg-glow-b"></div>
        <div data-hf-id="hf-r3kh" id="bg-grid" class="bgv bgv-grid"></div>
        <div id="bg-dots" class="bgv bgv-dots" aria-hidden="true" data-layout-ignore></div>
        <div id="bg-rays" class="bgv bgv-rays" aria-hidden="true" data-layout-ignore></div>
        <div id="bg-speed" class="bgv bgv-speed" aria-hidden="true" data-layout-ignore></div>
        <div data-hf-id="hf-5sl0" id="bg-ghost" aria-hidden="true" data-layout-ignore></div>
      </div>

{{SCENES}}

      <div data-hf-id="hf-jtoa" id="fx-flash"></div>
      <div id="fx-ring" aria-hidden="true" data-layout-ignore></div>
      <div id="fx-glitch" aria-hidden="true" data-layout-ignore></div>
      <div id="fx-wipe" aria-hidden="true" data-layout-ignore></div>
      <div id="fx-cover" aria-hidden="true" data-layout-ignore></div>
      <svg data-hf-id="hf-p0kn" id="fx-bolts" viewBox="0 0 1080 1920">
        <path data-hf-id="hf-ughk" class="bolt" id="bolt-a" d="M 760 -20 L 610 420 L 700 450 L 520 900 L 620 930 L 380 1500" />
        <path data-hf-id="hf-8a1e" class="bolt" id="bolt-b" d="M 160 -20 L 300 300 L 230 330 L 380 700" />
      </svg>

      <img data-hf-id="hf-ni8i" id="corner-logo" class="clip" data-start="0" data-duration="{{LOGO_UNTIL}}" data-track-index="8" src="assets/brand/logo-white.png" alt="" />

{{CAPTIONS_SLOT}}

{{AUDIO}}
    </div>

    <script>
      (function () {
        const DUR = {{DURATION}};
        const CUTS = {{CUTS}};
        const BG = "{{BG}}", CUT = "{{CUT}}";
        const tl = gsap.timeline({ paused: true });
        const prand = (n) => {
          const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };

        // ── พื้นหลังมีชีวิตตลอดคลิป (ambient) — นับรอบแบบ floor ไม่ให้เกินความยาวคลิป
        const rep = (cycle) => Math.max(0, Math.floor(DUR / cycle) - 1);
        tl.fromTo("#bg-glow-a", { scale: 0.9, opacity: 0.75 }, { scale: 1.12, opacity: 1, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: rep(2.2) }, 0);
        tl.fromTo("#bg-glow-b", { scale: 1.1, x: 0 }, { scale: 0.92, x: -120, duration: 2.8, ease: "sine.inOut", yoyo: true, repeat: rep(2.8) }, 0);
        tl.fromTo("#bg-ghost", { x: 0 }, { x: -900, duration: DUR, ease: "none" }, 0);
        if (BG === "grid") tl.fromTo("#bg-grid", { y: 0 }, { y: 120, duration: DUR, ease: "none" }, 0);
        if (BG === "dots") tl.fromTo("#bg-dots", { x: 0, y: 0 }, { x: -44, y: 88, duration: DUR, ease: "none" }, 0);
        if (BG === "rays") tl.fromTo("#bg-rays", { rotation: 0 }, { rotation: 24, duration: DUR, ease: "none" }, 0);
        if (BG === "speed") {
          // เส้นสปีดกระตุกเป็นจังหวะ (stepped) แบบหน้าการ์ตูน — หมุนทีละนิดทุก 0.12 วิ
          const n = Math.max(1, Math.floor(DUR / 0.12));
          for (let i = 0; i < n; i++) tl.set("#bg-speed", { rotation: (prand(i + 3) - 0.5) * 6, scale: 1 + prand(i + 9) * 0.04 }, i * 0.12);
        }

        // ── ฉากเปลี่ยนตรงรอยต่อฉาก (รวมจังหวะเปิดที่ 0)
        const bolts = ["#bolt-a", "#bolt-b"];
        bolts.forEach((sel) => {
          const p = document.querySelector(sel);
          const L = p.getTotalLength();
          p.style.strokeDasharray = L;
          p.style.strokeDashoffset = L;
        });
        // แถบกลิตช์ (สร้างครั้งเดียว ตำแหน่ง seeded)
        const gl = document.getElementById("fx-glitch");
        const G = [];
        if (CUT === "glitch") {
          const cols = ["rgba(89,210,255,0.85)", "rgba(232,247,255,0.9)", "rgba(27,141,255,0.8)", "rgba(255,194,74,0.7)"];
          for (let i = 0; i < 7; i++) {
            const el = document.createElement("div");
            el.className = "fx-g";
            el.style.top = Math.round(160 + prand(i * 7 + 1) * 1500) + "px";
            el.style.height = Math.round(18 + prand(i * 7 + 2) * 70) + "px";
            el.style.background = cols[i % cols.length];
            gl.appendChild(el);
            G.push(el);
          }
        }
        CUTS.forEach((t, i) => {
          const at = Math.max(0, t - 0.06);
          const first = i === 0;
          // แสงวาบมีทุกแบบ (เบาลงเมื่อมีตัวเปลี่ยนฉากอื่นทำงานหลัก)
          const peak = CUT === "flash" ? 1 : CUT === "bolt" ? (first ? 0.9 : 0.75) : 0.45;
          tl.fromTo("#fx-flash", { opacity: 0 }, { opacity: peak, duration: 0.05, ease: "none", immediateRender: first }, at);
          tl.to("#fx-flash", { opacity: 0, duration: CUT === "flash" ? 0.4 : 0.28, ease: "power2.out" }, at + 0.05);
          if (CUT === "bolt") {
            const sel = bolts[i % 2];
            const L = document.querySelector(sel).getTotalLength();
            tl.fromTo(sel, { strokeDashoffset: L, opacity: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, at);
            tl.to(sel, { opacity: 0, duration: 0.22, ease: "power1.out" }, at + 0.14);
          } else if (CUT === "flash") {
            tl.fromTo("#fx-ring", { scale: 0.2, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, at + 0.02);
          } else if (CUT === "glitch") {
            // 4 จังหวะกระตุก ~0.24 วิ — แถบเลื่อนซ้าย/ขวาแบบสุ่มคงที่ แล้วหาย
            for (let s = 0; s < 4; s++) {
              G.forEach((el, k) => {
                tl.set(el, { x: (prand(i * 31 + s * 7 + k) - 0.5) * 220, opacity: prand(i * 13 + s * 5 + k) > 0.35 ? 1 : 0 }, at + s * 0.06);
              });
            }
            tl.set(G, { opacity: 0 }, at + 0.26);
          } else if (CUT === "wipe" && first) {
            // เปิดคลิป: แสงกวาดโปร่ง เริ่มหลังเฟรมแรก (ภาพปก/ตัวอย่างเล่นอัตโนมัติต้องเห็นฉากจริง ไม่ใช่แถบ)
            tl.fromTo("#fx-wipe", { x: -1620, rotation: -12, opacity: 1 }, { x: 1300, rotation: -12, opacity: 1, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 0.05);
            tl.set("#fx-wipe", { opacity: 0 }, 0.66);
          } else if (CUT === "wipe") {
            // รอยตัด: แถบทึบวิ่งเส้นตรง 0.5 วิ — กลางทาง (= วินาทีที่ฉากสลับ t) ปิดเต็มจอ ~2.5 เฟรม แล้วเผยฉากใหม่
            // เดิมแถบโปร่งกวาด 0.42 วิแบบเร่ง-ผ่อน ผ่านจอจริงแค่ ~2 เฟรมและไม่บังรอยตัด — คลิปบน Actions เห็นแค่กะพริบ
            tl.fromTo("#fx-cover", { x: -2440, rotation: -12, opacity: 1 }, { x: 1320, rotation: -12, opacity: 1, duration: 0.5, ease: "none", immediateRender: false }, t - 0.25);
            tl.set("#fx-cover", { opacity: 0 }, t + 0.26);
          }
        });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
