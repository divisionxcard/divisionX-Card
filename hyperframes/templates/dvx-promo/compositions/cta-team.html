<!doctype html>
<!--
  cta-team — ฉากปิด "เลือกทีม · พิมพ์เลขในคอมเมนต์" (สเปก cta_spec.json → layouts[id=team] · 16 ต.ค. 2026)

  ทำไม: คลิปเลือกข้าง (versus) เป็นเกมโชว์อยู่แล้ว · คลิปอันดับ (rank) เป็นกระดานคะแนน → ฉากปิดเล่นเกมต่อ
    เป็น "หน้าเลือกตัวละคร" จากซองของคลิปเอง · คำตอบตอบได้ด้วยเลขตัวเดียว (คอมเมนต์ที่เขียนง่ายที่สุด)
    เคอร์เซอร์วนกลับช่อง 1 ทุกครั้ง = ชวนดูซ้ำ · ผลจริงยังติดอยู่: แชมป์ versus มีมงกุฎ + ป้ายแชมป์ของฉากเลือกข้าง
    (ป้ายซ่อนเมื่อรอบชิงเสมอ tie = 1) · อันดับ 1 ของ rank มีมงกุฎ
  ความจริง (กฎแข็ง): เลขบนช่องเป็นป้ายเสมอ "ทีม k" / "อันดับ k" (ไม่มีเลขเปล่า — อ่านเป็นยอดขายได้) · ไม่มีตัวเลขขาย/%/สต็อก
    ข้อความหัวเรื่อง/คำชวนมาจากตัวแปรที่ฝั่ง Python คุมให้ตรงกับเสียงพูด · stamp = บรรทัดที่มาของฉากรูปแบบ
  ช่อง (ไม่มีช่องว่างเปล่า): versus ตามลำดับเข้าแข่ง n=2 สองช่องสูง · n=3 = 2 + 1 กลาง · n=4 = 2×2 · rank n=5 = 3 + 2
    กึ่งกลางกริด x 492 → ขอบขวาช่อง 912–914 ตอนชี้ขยาย 1.04 ยังไม่เกิน x 930 (แถบปุ่มขวาของ TikTok)
    แถวที่มีมงกุฎเว้นที่ด้านบนให้มงกุฎ + ป้ายแชมป์ (ไม่ทับบรรทัดที่มา / ชื่อค่ายของช่องแถวบน)
  match cut (src = cx,cy,w,h,rot ของพระเอกบนเฟรมสุดท้ายของฉากก่อน · กล่อง contain):
    versus  ซองแชมป์เริ่มตรง src แล้วบินเข้าช่องของตัวเอง · ผู้แพ้บินกลับเข้าจากฝั่งที่ออกไป (กติกาฝั่งเดียวกับ fmt-versus
            = hf_render.versus_sides: 1 ซ้าย 2 ขวา ผู้ท้าชิงเข้าฝั่งตรงข้ามแชมป์) ด้วยท่าเข้าของ fmt-versus
            กรอบจริงบนเฟรมสุดท้ายของ fmt-versus = "294,889,428,407,0" (ซ้าย) / "794,889,428,407,0" (ขวา) — รูปอยู่ใน .vs-card
            ที่มีขอบ 4 px แล้วขยาย 1.07 (วัดจากภาพเรนเดอร์ 16 ต.ค.) · ส่ง 290/884/428×428 = ซองกระโดด ~4 px และใหญ่ขึ้น 5 % ตรงรอยต่อ
    rank    ซองย่อ 100 px ทั้งห้าเริ่มที่กระดาน fmt-rank (x 270 · y 719 + 132·(k−1)) แล้วบินเข้าช่อง (#5 ก่อน → #1)
  จังหวะ (วินาทีในฉาก): 0.00–0.45 ซองบิน + กรอบช่อง 0.9→1 · 0.12+ ผู้แพ้บินเข้า · 0.20 แถบป้ายกวาด · 0.30 หัวเรื่องกระแทก
    · 0.45 บรรทัดที่มา · 0.55–0.85 ป้ายเลขเด้ง · 0.80 มงกุฎหล่น + ขอบสีเน้น + ประกาย · 0.95 ป้ายแชมป์ · 1.10 คำชวน
    · 1.30 → dur−0.35 เคอร์เซอร์กระโดด 1→2→…→N→1 (เลื่อน 0.12 + พัก 0.28 · นับรอบจาก dur) ช่องที่ชี้ขยาย 1.04 + สว่าง
    · 0.35 วิสุดท้ายนิ่งสนิทที่ช่อง 1 (เฟรมวนคลิปสะอาด)
  ขนาดตัวอักษร: หัวเรื่อง tpx · คำชวน apx มาจาก Python (fit_px) · ชื่อ/ค่าย/ป้ายแชมป์/บรรทัดที่มา วัดในฉากนี้ด้วยตารางความกว้าง
    อักษร Kanit จริง (ค่าเดียวกับ fit_px — ไม่วัด DOM ตอนเรนเดอร์ ฟอนต์อาจยังโหลดไม่เสร็จ) · ชื่อยาวขึ้น 2 บรรทัดตามช่องว่าง
  ฉากโปร่ง — พื้นหลังกรมท่า/ลาย/โลโก้มุมมาจาก index.html
-->

          const AR = S.w / S.h;                              // กล่องซองสัดส่วนเดียวกับกรอบต้นทาง → contain วางรูปเหมือนเดิมทุกสัดส่วนรูป
          const BW = Math.min(artW, artH * AR), BH = BW / AR;
          const PK_L = (TW - BW) / 2, PK_T = ART_T + (artH - BH) / 2;
          const LABEL = MODE === "rank" ? "อันดับ" : "ทีม";
          for (let k = 1; k <= N; k++) {
            const r = RECT[k];
            ["t", "o"].forEach((p) => {
              const el = $(p + k);
              el.style.left = r.x + "px";
              el.style.top = r.y + "px";
              el.style.width = TW + "px";
              el.style.height = TH + "px";
            });
            const pk = $("p" + k);
            pk.style.left = PK_L + "px";
            pk.style.top = PK_T + "px";
            pk.style.width = BW + "px";
            pk.style.height = BH + "px";
            const nm = $("n" + k), f = FIT[k];
            nm.textContent = "";
            if (f) {
              nm.style.fontSize = f.px + "px";
              f.lines.forEach((ln) => {
                const s = document.createElement("span");
                s.className = "cta-team-nl";
                s.textContent = ln;
                nm.appendChild(s);
              });
            }
            const tag = str(v["tag" + k]), tg = $("g" + k);
            tg.textContent = tag;
            if (tag) tg.style.fontSize = (fitPx(tag, 600, innerW, 26, 16) || 16) + "px";
            $("bl" + k).textContent = LABEL;
          }
          if (MODE === "rank") $("b1").classList.add("cta-team-gold");    // อันดับ 1 ทองเหมือนกระดาน fmt-rank

          // ── ของแชมป์: มงกุฎกลางบน · ป้ายแชมป์คร่อมขอบบน (versus · ไม่เสมอ) · ประกาย — อยู่ในชั้นบนของช่องแชมป์
          const FINAL = str(v.final);
          const PILL = MODE === "versus" && num(v.tie, 0) < 0.5 && FINAL !== "";
          const ov = $("o" + CHAMP);
          ov.classList.add("cta-team-top");
          const crown = $("crown"), pillRow = $("pill-row"), sparks = $("sparks");
          ov.appendChild(crown);
          ov.appendChild(pillRow);
          ov.appendChild(sparks);
          $("champ").remove();
          const BADGE_R = -14 + 96 + 8;                      // ขอบขวาป้ายเลข + ระยะห่าง — ป้ายแชมป์/มงกุฎไม่ทับป้ายเลข
          let crownCX = Math.max(TW / 2, BADGE_R + 48), crownBottom = 6;
          if (PILL) {
            const ppx = fitPx(FINAL, 900, TW - BADGE_R - 8 - 44, 32, 18) || 18;
            const pw = w1(FINAL, 900) * ppx + 44, ph = ppx * 1.15 + 8;
            const pcx = Math.min(TW - 6 - pw / 2, Math.max(TW / 2, BADGE_R + pw / 2));
            $("pill").style.fontSize = ppx + "px";
            pillRow.style.left = pcx - 200 + "px";
            pillRow.style.top = -ph / 2 + "px";
            crownCX = pcx;
            crownBottom = -ph / 2 + 26;                      // ป้ายบังโคนมงกุฎ (แบบเฟรมสุดท้ายของ fmt-versus)
          } else {
            pillRow.remove();
          }
          crown.style.left = crownCX - 48 + "px";
          crown.style.top = crownBottom - 75 + "px";
          sparks.style.left = crownCX + "px";
          sparks.style.top = crownBottom - 34 + "px";

          // ── ขนาดตัวอักษรหัว/คำชวน: Python ส่ง tpx/apx มา · ตรวจซ้ำด้วยตาราง (ห้ามกว้างเกิน 900 / 860)
          const TITLE = str(v.title), ASK = str(v.ask), STAMP = str(v.stamp), KICK = str(v.kicker);
          if (TITLE) $("title").style.fontSize = Math.min(num(v.tpx, 104) > 0 ? num(v.tpx, 104) : 104, fitPx(TITLE, 900, 900, 104, 40) || 40) + "px";
          if (STAMP) $("stamp").style.fontSize = (fitPx(STAMP, 600, 860, 30, 20) || 20) + "px";
          if (KICK) $("kick").style.fontSize = (fitPx(KICK, 800, 640, 30, 20) || 20) + "px";
          if (ASK) $("ask-t").style.fontSize = Math.min(num(v.apx, 58) > 0 ? num(v.apx, 58) : 58, fitPx(ASK, 900, 860 - 82, 58, 28) || 28) + "px";
          else $("ask").remove();
          if (!KICK) $("kick-row").remove();

          // ── 0. match cut: พระเอกเริ่มที่กรอบ src (ของฉากก่อน) แล้วบินเข้ากล่องรูปของช่อง
          const OVL = (k) => ["#cta-team-t" + k, "#cta-team-o" + k];    // ช่อง + ชั้นบนของช่อง เคลื่อนพร้อมกันเสมอ
          function fromSrc(k, cx, cy, w, rot) {
            const ccx = RECT[k].x + PK_L + BW / 2, ccy = RECT[k].y + PK_T + BH / 2;
            return { x: cx - ccx, y: cy - ccy, scale: w / BW, rotation: rot };
          }
          const FLY = T(0.45);
          if (MODE === "versus") {
            tl.fromTo("#cta-team-p" + CHAMP, fromSrc(CHAMP, S.cx, S.cy, S.w, S.rot), { x: 0, y: 0, scale: 1, rotation: 0, duration: FLY, ease: "power3.inOut" }, 0);
            tl.fromTo("#cta-team-y" + CHAMP, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: FLY, ease: "power2.out" }, 0);
            // ผู้แพ้บินกลับเข้าจากฝั่งที่ออกไป (ท่าเข้าของ fmt-versus) · ห่างกัน 0.1 วิ ตามลำดับเข้าแข่ง
            // ยกเว้นสองช่องแถวเดียวกันที่เข้าจากฝั่งเดียวกัน: ช่องที่ไกลจากขอบกว่าออกก่อน (ไม่บินทะลุทับกันกลางทาง)
            const losers = [];
            for (let k = 1; k <= N; k++) if (k !== CHAMP) losers.push(k);
            losers.sort((a, b) => {
              if (side[a] === side[b] && RECT[a].y === RECT[b].y) {
                const da = side[a] === "L" ? RECT[a].x : -RECT[a].x, db = side[b] === "L" ? RECT[b].x : -RECT[b].x;
                return db - da;
              }
              return a - b;
            });
            losers.forEach((k, i) => {
              const dir = side[k] === "L" ? -1 : 1, at = T(0.12 + 0.1 * i);
              tl.fromTo(OVL(k), { x: dir * 720, rotationY: dir * -55, rotation: dir * 8, transformPerspective: 1400 },
                { x: 0, rotationY: 0, rotation: 0, transformPerspective: 1400, duration: T(0.5), ease: "power3.out" }, at);
              tl.set(OVL(k), { transformPerspective: 0 }, at + T(0.5));      // ลงจอดแล้วเหลือ transform 2D (ตัวหนังสือคม)
            });
          } else {
            // ซองย่อ 100 px บนกระดาน fmt-rank (แถวละ 132) → ช่องของอันดับนั้น · #5 ออกก่อน ห่างกัน 0.06 วิ
            for (let k = N; k >= 1; k--) {
              tl.fromTo("#cta-team-p" + k, fromSrc(k, S.cx, S.cy + (k - 1) * 132, S.w, S.rot),
                { x: 0, y: 0, scale: 1, rotation: 0, duration: FLY, ease: "power3.inOut" }, T(0.06 * (N - k)));
            }
            const bodies = [];
            for (let k = 1; k <= N; k++) bodies.push("#cta-team-y" + k);
            tl.fromTo(bodies, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: FLY, ease: "power2.out" }, 0);
          }

          // ── 1. หัว: ป้ายเล็ก · แถบกวาดจากซ้าย · หัวเรื่องกระแทก · บรรทัดที่มา
          if (KICK) tl.fromTo("#cta-team-kick", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: T(0.36), ease: "back.out(2.2)" }, T(0.14));
          tl.fromTo("#cta-team-band", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: T(0.35), ease: "expo.out" }, T(0.2));
          if (TITLE) tl.fromTo("#cta-team-title", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: T(0.36), ease: "power4.out" }, T(0.3));
          if (STAMP) tl.fromTo("#cta-team-stamp", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: T(0.35), ease: "power2.out" }, T(0.45));

          // ── 2. ป้ายเลขเด้ง 1 → N
          for (let k = 1; k <= N; k++) {
            tl.fromTo("#cta-team-b" + k, { scale: 0 }, { scale: 1, duration: T(0.4), ease: "back.out(2.6)" }, T(0.55 + 0.07 * (k - 1)));
          }

          // ── 3. มงกุฎหล่นบนแชมป์/อันดับ 1 · ขอบสีเน้นติด · ประกาย 20 ดวง (seeded) · ป้ายแชมป์เด้ง
          const C_AT = T(0.8);
          tl.fromTo(crown, { y: -110, rotation: -20 }, { y: 0, rotation: 0, duration: T(0.45), ease: "bounce.out" }, C_AT);
          tl.fromTo(crown, { opacity: 0 }, { opacity: 1, duration: T(0.1), ease: "power1.out" }, C_AT);
          tl.fromTo("#cta-team-l" + CHAMP, { opacity: 0 }, { opacity: 1, duration: T(0.14), ease: "power1.out" }, C_AT + T(0.12));
          const SPK = ["#ffc24a", "#fff1b8", "#ffffff", "#59d2ff"], parts = [];
          for (let i = 0; i < 20; i++) {
            const el = document.createElement("div");
            el.className = "cta-team-spark";
            el.setAttribute("aria-hidden", "true");
            el.setAttribute("data-layout-ignore", "");
            const size = 8 + prand(i * 3 + 11) * 11;
            el.style.width = size + "px";
            el.style.height = size + "px";
            el.style.marginLeft = -size / 2 + "px";
            el.style.marginTop = -size / 2 + "px";
            el.style.background = SPK[i % SPK.length];
            el.style.boxShadow = "0 0 14px " + SPK[i % SPK.length];
            sparks.appendChild(el);
            const ang = prand(i * 5 + 23) * Math.PI * 2, sp = 300 + prand(i * 7 + 31) * 320;
            parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
          }
          const FL = 0.7, d = { T: 0 };
          tl.fromTo(d, { T: 0 }, {
            T: 1, duration: FL, ease: "none", immediateRender: false,
            onUpdate: () => {
              const t = d.T * FL, fade = Math.min(1, (1 - d.T) / 0.35);
              parts.forEach((p) => {
                p.el.style.transform = "translate(" + p.vx * t + "px," + (p.vy * t + 260 * t * t) + "px)";
                p.el.style.opacity = String(d.T === 0 || d.T === 1 ? 0 : fade);
              });
            },
          }, C_AT + T(0.12));
          if (PILL) tl.fromTo("#cta-team-pill", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: T(0.4), ease: "back.out(2.4)" }, T(0.95));

          // ── 4. คำชวนลอยขึ้น + ไอคอนแชตเด้งหนึ่งครั้ง
          if (ASK) {
            tl.fromTo("#cta-team-ask", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: T(0.3), ease: "power3.out" }, T(1.1));
            tl.fromTo("#cta-team-bub", { y: 0 }, { y: -16, duration: T(0.14), ease: "power2.out", immediateRender: false }, T(1.3));
            tl.fromTo("#cta-team-bub", { y: -16 }, { y: 0, duration: T(0.42), ease: "bounce.out", immediateRender: false }, T(1.44));
          }

          // ── 5. เคอร์เซอร์เลือก: โผล่ที่ช่อง 1 → กระโดด 1→2→…→N→1 (เลื่อน 0.12 + พัก 0.28) จบที่ช่อง 1 ก่อนช่วงนิ่ง
          const OUT = 11, HS = 1.04;
          const CW = TW * HS + 2 * OUT, CH = TH * HS + 2 * OUT;
          const cpos = (k) => ({ x: RECT[k].x + TW / 2 - CW / 2, y: RECT[k].y + TH / 2 - CH / 2 });
          const cur = $("cur"), P1 = cpos(1);
          cur.style.left = P1.x + "px";
          cur.style.top = P1.y + "px";
          cur.style.width = CW + "px";
          cur.style.height = CH + "px";
          function hover(k, on, t) {
            tl.fromTo(OVL(k), { scale: on ? 1 : HS }, { scale: on ? HS : 1, duration: 0.12, ease: "power2.inOut", immediateRender: false }, t);
            tl.fromTo("#cta-team-h" + k, { opacity: on ? 0 : 1 }, { opacity: on ? 1 : 0, duration: 0.12, ease: "power1.out", immediateRender: false }, t);
          }
          const C0 = T(1.3), GLIDE = 0.12, REST = 0.28, STEP = GLIDE + REST;
          if (C0 + 0.2 <= STILL + 1e-6) {
            tl.fromTo(cur, { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, C0);
            hover(1, true, C0);
            const hops = Math.max(0, Math.floor((STILL - C0) / STEP + 1e-6));
            const path = [1];
            for (let j = 1; j <= hops; j++) path.push((j % N) + 1);
            path[path.length - 1] = 1;                        // จบที่ช่อง 1 เสมอ (เฟรมสุดท้าย = เฟรมแรกของรอบถัดไป)
            if (path.length >= 2 && path[path.length - 2] === 1) path.pop();
            for (let j = 1; j < path.length; j++) {
              const a = path[j - 1], b = path[j], s = C0 + REST + (j - 1) * STEP;
              const pa = cpos(a), pb = cpos(b);
              tl.fromTo(cur, { x: pa.x - P1.x, y: pa.y - P1.y }, { x: pb.x - P1.x, y: pb.y - P1.y, duration: GLIDE, ease: "power2.inOut", immediateRender: false }, s);
              hover(a, false, s);
              hover(b, true, s);
            }
          }

          window.__timelines["cta-team"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
