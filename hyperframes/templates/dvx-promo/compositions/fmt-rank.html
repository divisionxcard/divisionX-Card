          // เวลาของแต่ละอันดับ (คำนวณก่อน — ? ต้องหยุดหายใจก่อนช่องนั้นถูกเติม ไม่งั้นทับกันแล้ว ? โผล่กลับ)
          // อันดับ 1 ค้างกลางจอนานกว่า (HOLD) แล้วบินเข้าช่องเหมือนอันดับอื่น — จบด้วยกระดานเต็มที่อ่านได้ทุกช่อง
          // (ลองให้ค้างใหญ่เป็นตัวเอกแล้ว ซองบังชื่ออันดับ 2–5 จนอ่านไม่ออก) · hf_render ยืดฉากนี้เข้าบรรทัดปิดราว 0.9 วิ
          // K ย่อจังหวะอันดับ 1 เมื่อเหลือเวลาหลังพูดชื่อน้อย (ต้องการ ~2 วิ: ค้าง 0.8 + บิน 0.38 + ดูกระดานเต็ม 0.8)
          const T = {};
          for (let r = 5; r >= 1; r--) {
            const LN = num(v["ln" + r], 2.6 + (5 - r) * 1.6);
            const AT = Math.max(LN + 0.15, num(v["at" + r], LN + 0.5));
            const K = r === 1 ? Math.max(0.5, Math.min(1, (DUR - AT) / 1.98)) : 1;
            const HOLD = r === 1 ? 0.8 * K : 0.55;
            T[r] = { LN, AT, K, HOLD, LAND: AT + HOLD + 0.36 };
          }
          // เครื่องหมาย ? หายใจระหว่างรอ (finite · จบก่อนช่องถูกเติม)
          for (let r = 1; r <= 5; r++) {
            const s = 1.0 + r * 0.11, cyc = 0.6;
            const reps = Math.max(0, Math.floor((T[r].LAND - 0.15 - s) / cyc) - 1);
            tl.fromTo("#rank-m" + r, { opacity: 0.6 }, { opacity: 1, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: reps, immediateRender: false }, s);
          }
          // คำถามสีทองเต้นเบา ๆ จนกว่าจะเฉลยอันดับ 1 (open loop)
          tl.fromTo("#rank-q2", { scale: 1 }, { scale: 1.05, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((T[1].AT - 1.0) / 0.7) - 1), immediateRender: false }, 1.0);

          // ── 2. เผยทีละอันดับ 5 → 1
          const palette = ["#59d2ff", "#1b8dff", "#ffffff", "#ffc24a"];
          const gold = ["#ffc24a", "#fff1b8", "#ffffff", "#ff9d2a"];
          function burst(r, at, big) {
            const field = document.getElementById("rank-p" + r);
            const cols = big ? gold : palette;
            const N = big ? 26 : 16;
            const parts = [];
            for (let i = 0; i < N; i++) {
              const el = document.createElement("div");
              el.className = "rank-spark";
              const size = 9 + prand(r * 97 + i * 3 + 1) * (big ? 16 : 11);
              el.style.width = size + "px";
              el.style.height = size + "px";
              el.style.background = cols[i % cols.length];
              el.style.boxShadow = "0 0 16px " + cols[i % cols.length];
              field.appendChild(el);
              const ang = prand(r * 31 + i * 5 + 2) * Math.PI * 2;
              const sp = (big ? 700 : 520) + prand(r * 13 + i * 7 + 3) * 560;
              parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
            }
            const FL = 0.7, d = { T: 0 };
            tl.fromTo(d, { T: 0 }, {
              T: 1, duration: FL, ease: "none", immediateRender: false,
              onUpdate: () => {
                const t = d.T * FL, fade = Math.min(1, (1 - d.T) / 0.35);
                parts.forEach((p) => {
                  p.el.style.transform = "translate(" + p.vx * t + "px," + (p.vy * t + 260 * t * t) + "px)";
                  p.el.style.opacity = String(d.T === 0 ? 0 : fade);
                });
              },
            }, at);
          }

          for (let r = 5; r >= 1; r--) {
            const big = r === 1;
            const { LN, AT, K, HOLD, LAND } = T[r];
            const st = "#rank-s" + r;
            // ป้ายเลขเด้งตอนเริ่มพูด "อันดับ…"
            tl.fromTo("#rank-b" + r, { scale: 1 }, { scale: 1.28, duration: 0.14, ease: "power2.out", immediateRender: false }, LN);
            tl.to("#rank-b" + r, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, LN + 0.14);
            // ม่านมืด + ซองพุ่งขึ้นกลางจอตอนพูดชื่อ
            tl.fromTo("#rank-dim", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", immediateRender: false }, AT - 0.14);
            tl.fromTo(st, { scale: 0.25, rotation: -16, y: 160, opacity: 0, filter: "blur(16px)" },
              { scale: big ? 1.12 : 1, rotation: -4, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(1.7)" }, AT - 0.1);
            tl.fromTo("#rank-g" + r, { scale: 0.3, opacity: 0.95 }, { scale: big ? 2.6 : 2.1, opacity: 0, duration: 0.65, ease: "power2.out", immediateRender: false }, AT + 0.12);
            burst(r, AT + 0.12, big);
            if (big) {
              // อันดับ 1: กระดานสั่นตอนชน (seeded — เหมือนกันทุกครั้งที่เรนเดอร์)
              for (let k = 0; k < 6; k++) {
                tl.to("#rank-world", { x: (prand(k * 9 + 4) - 0.5) * 26, y: (prand(k * 9 + 7) - 0.5) * 22, duration: 0.035, ease: "none" }, AT + 0.12 + k * 0.035);
              }
              tl.to("#rank-world", { x: 0, y: 0, duration: 0.12, ease: "power2.out" }, AT + 0.33);
            }
            // บินเข้าช่อง (ขนาด/ตำแหน่งคำนวณจากค่าคงที่ — รูปซองใหญ่กับรูปในช่องเป็นรูปเดียวกัน)
            const dx = THUMB_CX - STAGE_CX, dy = rowCY(r) - STAGE_CY;
            tl.to(st, { x: dx, y: dy, scale: THUMB / STAGE, rotation: 0, duration: 0.38, ease: "power3.inOut" }, AT + HOLD);
            tl.to("#rank-dim", { opacity: 0, duration: 0.3, ease: "power2.out" }, AT + HOLD + 0.05);
            // ช่องสว่าง + ชื่อกวาดเข้า + ? หาย
            tl.to("#rank-m" + r, { opacity: 0, scale: 0.4, duration: 0.12, ease: "power2.in" }, LAND - 0.1);
            tl.fromTo("#rank-l" + r, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, LAND);
            tl.fromTo("#rank-t" + r, { clipPath: "inset(0% 100% 0% 0%)", x: 30 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.36, ease: "power3.out" }, LAND + 0.02);
            tl.fromTo("#rank-r" + r, { scale: 1 }, { scale: 1.04, duration: 0.09, ease: "power2.out", immediateRender: false }, LAND);
            tl.to("#rank-r" + r, { scale: 1, duration: 0.35, ease: "power3.out" }, LAND + 0.09);
            if (big) {
              tl.fromTo("#rank-crown", { y: -120, opacity: 0, rotation: -25 }, { y: 0, opacity: 1, rotation: -12, duration: 0.42 * K, ease: "bounce.out" }, LAND + 0.05);
              // กระดานครบ: คลื่นแสงไล่จากอันดับ 1 ลงล่าง (เฉลยของคำถามที่ค้างมาทั้งคลิป)
              for (let q = 2; q <= 5; q++) {
                tl.fromTo("#rank-r" + q, { scale: 1 }, { scale: 1.035, duration: 0.1, ease: "power2.out", immediateRender: false }, LAND + 0.18 + (q - 2) * 0.07);
                tl.to("#rank-r" + q, { scale: 1, duration: 0.3, ease: "power3.out" }, LAND + 0.28 + (q - 2) * 0.07);
              }
            }
          }

          window.__timelines["fmt-rank"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
