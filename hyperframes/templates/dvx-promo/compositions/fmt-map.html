  ทำไมรูปแบบนี้ (ผลสำรวจตลาด 16 ต.ค. 2026):
    คลิป "เจอตู้การ์ด/ตู้อยู่ที่ไหน" ทำวิวสูงทั้งไทยและต่างประเทศ (Vending machine spotted 5.86M · Searched EVERY vending
    machine in my city 117K ใช้แผนที่หมุด) · ไทย: "พิกัดตู้เหลือง เซ็นทรัลพิษณุโลก ชั้น 1 หลังเคเอฟซี" 47K จากห้างเดียว

    ข้อมูลชั้น/จุดสังเกตมาจาก machines.config.branch (คนติดตั้งตู้จดเอง) — ไม่แต่งเส้นทางเดินที่ไม่รู้จริง

  แผนที่: "ภาพกราฟิกโดยประมาณ" ไม่ใช่แผนที่จริง — แม่น้ำเจ้าพระยา + หมุดจากพิกัดห้างโดยประมาณ (hf_formats.MALLS)

  จังหวะ: บรรทัด 0 หมุดหล่น + นับจำนวนตู้ · zm = เริ่มซูม · nm = พูดชื่อห้าง · fl = พูดชั้น · lm = พูดจุดสังเกต
-->

        (function () {

          const DUR = Math.max(1, num(v.dur, 9.5));
          const ZM = num(v.zm, 3.2), NM = Math.max(ZM + 0.2, num(v.nm, ZM + 0.6));
          const FL = Math.max(NM + 0.5, num(v.fl, NM + 1.6)), LM = Math.max(FL + 0.6, num(v.lm, FL + 1.6));
          const COUNT = Math.round(num(v.count, 12));
          const FX = num(v.fx, 545), FY = num(v.fy, 447), Z = 2.3;
          const tl = gsap.timeline({ paused: true });

          // ── หมุดทุกสาขา (สร้างครั้งเดียวตอนประกอบ — ตำแหน่งจากตัวแปร ไม่สุ่ม)
          const pinsEl = document.getElementById("map-pins");
          const pins = String(v.pins || "").split(";").map((s) => s.split(",").map(Number)).filter((p) => p.length >= 2 && isFinite(p[0]) && isFinite(p[1]));
          const pinEls = pins.map(([x, y, n], i) => {
            const el = document.createElement("div");
            el.className = "map-pin";
            el.id = "map-pin-" + i;
            el.style.left = x + "px";
            el.style.top = y + "px";
            el.innerHTML = '<div class="map-pin-ring"></div><div class="map-pin-dot"></div>' + (n > 1 ? '<div class="map-pin-n" data-layout-allow-occlusion>' + n + "</div>" : "");
            pinsEl.appendChild(el);
            return el;
          });

          // ── 1. หัวเรื่อง + แผนที่ขึ้น + แม่น้ำลาก
          tl.fromTo("#map-kicker", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.05);
          tl.fromTo("#map-q1", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, 0.12);
          tl.fromTo("#map-q2", { scale: 2.1, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, 0.3);
          tl.fromTo("#map-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.6);
          tl.fromTo("#map-panel", { y: 260, opacity: 0, rotationX: 28, transformPerspective: 1400 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.6, ease: "power3.out", transformPerspective: 1400 }, 0.15);
          ["#map-river", "#map-river-glow"].forEach((sel) => {
            const p = document.querySelector(sel);
            const L = p.getTotalLength();
            p.style.strokeDasharray = L;
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.45);
          });
          tl.fromTo(["#map-river-label", "#map-city"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.1);

          // หมุดหล่นทีละอัน (ตามลำดับรายการ) + ตัวนับตู้วิ่งตาม
          const P0 = 0.8, P1 = Math.max(P0 + 0.6, Math.min(ZM - 0.5, P0 + 0.16 * pinEls.length));
          const step = pinEls.length > 1 ? (P1 - P0) / (pinEls.length - 1) : 0;
          pinEls.forEach((el, i) => {
            const t = P0 + i * step;
            tl.fromTo(el, { y: -90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "bounce.out" }, t);
            tl.fromTo(el.querySelector(".map-pin-ring"), { scale: 1, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, t + 0.25);
          });
          tl.fromTo("#map-count", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, P0 - 0.1);
          const cnt = document.getElementById("map-count-n"), cd = { n: 0 };
          tl.fromTo(cd, { n: 0 }, { n: COUNT, duration: Math.max(0.3, P1 - P0 + 0.3), ease: "none", onUpdate: () => { cnt.textContent = String(Math.round(cd.n)); } }, P0);
          if (String(v.offmap || "").trim()) {
            tl.fromTo("#map-off", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, P1);
          }

          // ── 2. ซูมเข้าห้างที่เลือก: กล้องพาหมุดไปกลางแผ่น · หมุดอื่นหรี่ · หมุดทองโผล่ + ชื่อห้างกระแทก
          tl.to("#map-cam", { scale: Z, x: 480 - FX * Z, y: 330 - FY * Z, duration: 0.8, ease: "power3.inOut" }, ZM);
          tl.to(pinEls, { opacity: 0.25, duration: 0.3, ease: "power1.out" }, ZM);
          tl.to(["#map-count", "#map-off", "#map-river-label", "#map-city"], { opacity: 0, duration: 0.25, ease: "power1.out" }, ZM);
          const foc = document.getElementById("map-focus");
          foc.style.left = FX + "px";
          foc.style.top = FY + "px";
          // หมุดทองต้านสเกลกล้อง (ไม่ให้ใหญ่ตามซูม 2.3 เท่า)
          tl.fromTo("#map-focus", { scale: 0.2 / Z, opacity: 0, y: -60 / Z }, { scale: 1 / Z * 1.6, opacity: 1, y: 0, duration: 0.45, ease: "back.out(2.4)" }, ZM + 0.6);
          ["#map-fr1", "#map-fr2"].forEach((sel, k) => {
            const cyc = 1.1, s = ZM + 0.9 + k * 0.55;
            tl.fromTo(sel, { scale: 0.6, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: cyc, ease: "power2.out", repeat: Math.max(0, Math.floor((DUR - s) / cyc) - 1), immediateRender: false }, s);
          });
          tl.fromTo("#map-mall", { scale: 2.2, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, NM);
          tl.fromTo("#map-q2", { scale: 1 }, { scale: 1.06, duration: 0.1, ease: "power2.out", immediateRender: false }, NM);
          tl.to("#map-q2", { scale: 1, duration: 0.3, ease: "power3.out" }, NM + 0.1);

          // ── 3. จอลิฟต์: ชั้นวิ่งจาก G ขึ้นไปถึงชั้นจริง (ชั้นอื่นในรีลเป็นแค่ตัวนับ ไม่ใช่ข้อมูลห้าง)
          const floorRaw = String(v.floor || "").trim().toUpperCase();
          const fn = /^\d+$/.test(floorRaw) ? Math.min(30, parseInt(floorRaw, 10)) : null;
          const labels = fn == null ? [floorRaw || "G"] : ["G"].concat(Array.from({ length: Math.max(1, fn) }, (_, i) => String(i + 1)));
          const reel = document.getElementById("map-reel");
          labels.forEach((t) => {
            const s = document.createElement("span");
            s.className = "map-floor";
            s.setAttribute("data-layout-allow-occlusion", "");
            s.setAttribute("data-layout-allow-overflow", "");
            s.textContent = t;
            reel.appendChild(s);
          });
          tl.fromTo("#map-lift", { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, FL - 0.3);
          tl.fromTo("#map-reel", { y: 0 }, { y: -150 * (labels.length - 1), duration: Math.min(1.1, 0.25 + 0.12 * labels.length), ease: "power2.inOut" }, FL - 0.05);
          const ARR = FL - 0.05, ARR_END = ARR + Math.min(1.1, 0.25 + 0.12 * labels.length);
          tl.fromTo("#map-lift-arrow", { opacity: 1 }, { opacity: 0.2, duration: 0.15, ease: "none", yoyo: true, repeat: Math.max(1, Math.floor((ARR_END - ARR) / 0.15) - 1), immediateRender: false }, ARR);
          tl.to("#map-lift-arrow", { opacity: 1, duration: 0.1 }, ARR_END);
          tl.fromTo("#map-lift-box", { boxShadow: "0 0 36px rgba(27,141,255,0.7)" }, { boxShadow: "0 0 70px rgba(255,194,74,0.95)", duration: 0.2, ease: "power2.out", immediateRender: false }, ARR_END);

          // ── 4. จุดสังเกต
          tl.fromTo("#map-lm", { y: 60, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2)" }, LM);
          tl.fromTo("#map-lm-ico", { y: -30 }, { y: 0, duration: 0.5, ease: "bounce.out" }, LM + 0.1);

          // ── 5. การ์ดรูปตู้จริงของสาขา (เฉพาะเมื่อมีรูป · ph = เริ่มพูดบรรทัด "หน้าตาตู้…")
          const PH = num(v.ph, 999);
          if (String(v.photo || "").trim() && PH < DUR - 0.5) {
            // แผนที่/ชื่อห้าง/จอลิฟต์/จุดสังเกตจางออกก่อน (ไม่ปล่อยค้างใต้พื้นหลังเบลอ — ตัวตรวจนับเป็นข้อความถูกบัง)
            tl.to(["#map-panel", "#map-mall", "#map-lift", "#map-lm"], { opacity: 0, duration: 0.3, ease: "power2.in" }, PH - 0.2);
            tl.fromTo("#map-pbg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, PH - 0.15);
            tl.fromTo("#map-pcard", { y: 260, rotationX: 32, scale: 0.86, opacity: 0, transformPerspective: 1400 },
              { y: 0, rotationX: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out", transformPerspective: 1400 }, PH - 0.1);
            tl.fromTo("#map-pimg", { scale: 1.0 }, { scale: 1.1, duration: Math.max(0.5, DUR - PH), ease: "sine.inOut" }, PH - 0.1);
            tl.fromTo("#map-pgloss", { xPercent: -130, rotation: 16 }, { xPercent: 380, rotation: 16, duration: 0.8, ease: "power2.inOut" }, PH + 0.55);
            tl.fromTo("#map-plabel", { scale: 0.3, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(2.2)" }, PH + 0.4);
          }

          window.__timelines["fmt-map"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
