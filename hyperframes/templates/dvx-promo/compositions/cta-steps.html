          <div class="cta-steps-q dvx-q dvx-q2" id="cta-steps-q2" data-var-text="q2" style="font-size: calc(var(--qs2, 124) * 1px)">แค่ 4 ขั้นตอน</div>

      <script>
        (function () {
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const num = (x, d) => (x != null && x !== "" && isFinite(Number(x)) ? Number(x) : d);
          const str = (x) => (x == null ? "" : String(x)).trim();
          const $ = (id) => document.getElementById("cta-steps-" + id);
          const DUR = Math.max(2, num(v.dur, 6.4));
          const STILL = DUR - 0.4;                       // 0.4 วิสุดท้าย: ไม่มีอะไรในฉากนี้ขยับ
          const tl = gsap.timeline({ paused: true });
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };

          // ── ค่าคงที่ของเลย์เอาต์ (ตรงกับ CSS — ไม่วัด DOM)
          const ROW_TOP = [470, 646, 822, 998], ROW_H = 160;
          const rowCY = (k) => ROW_TOP[k - 1] + ROW_H / 2;        // 550 / 726 / 902 / 1078
          const TILE_CX = 200 + 10 + 70, TILE = 140, PACK_BOX = 124;
          const RAIL_TOP = rowCY(1), RAIL_LEN = rowCY(4) - rowCY(1);

          // ── เวลาติดไฟแต่ละขั้น: ตามเสียง (st1..st4) · ห่างกัน ≥ 0.35 · ขั้น 4 ต้องจบท่าก่อนช่วงนิ่ง
          const ST = [1, 2, 3, 4].map((k) => num(v["st" + k], [2.6, 3.3, 4.1, 5.0][k - 1]));
          const IG = [];
          for (let i = 0; i < 4; i++) IG[i] = Math.max(i === 0 ? 0.5 : IG[i - 1] + 0.35, ST[i]);
          const LAST = STILL - 0.6;
          if (IG[3] > LAST) {
            IG[3] = LAST;
            for (let i = 2; i >= 0; i--) IG[i] = Math.min(IG[i], IG[i + 1] - 0.35);
          }

          // ── กรอบฮีโร่บนเฟรมสุดท้ายของฉากก่อนหน้า (cx,cy,w,h,rot)
          const S = str(v.src).split(",").map((x) => Number(x));
          const okSrc = S.length >= 4 && S.slice(0, 4).every((x) => isFinite(x)) && S[2] > 0 && S[3] > 0;
          const CX = okSrc ? S[0] : TILE_CX, CY = okSrc ? S[1] : rowCY(1);
          const W = okSrc ? S[2] : TILE, H = okSrc ? S[3] : TILE, ROT = okSrc && isFinite(S[4]) ? S[4] : 0;
          const PACK = str(v.icon1) !== "";

          // ── ป้ายลิงก์: ตัด ▶ หน้าข้อความ (วาดเป็นปุ่มเล่นแทน) · แยกคำบรรยายกับลิงก์ที่ " · " ตัวสุดท้าย
          const foot = str(v.foot).replace(/^▶\s*/, "");
          let cap = foot, link = "";
          const cut = foot.lastIndexOf(" · ");
          if (cut >= 0) {
            cap = foot.slice(0, cut).trim();
            link = foot.slice(cut + 3).trim();
          }
          if (!foot) link = str(v.url);
          $("foot-cap").textContent = cap;
          $("foot-url").textContent = link;
          if (!cap) $("foot-cap").remove();
          if (!link) $("foot-url").remove();
          if (!cap || !link) $("foot-dot").remove();
          const HAS_FOOT = !!(cap || link);
          if (!HAS_FOOT) $("foot").remove();

          // ── 0. match cut
          if (PACK) {
            $("i1").remove();
            const hero = $("hero");
            hero.style.left = CX - W / 2 + "px";
            hero.style.top = CY - H / 2 + "px";
            hero.style.width = W + "px";
            hero.style.height = H + "px";
            // เงาเท่าสัดส่วนเดียวกับซองในฉากรูปแบบ (quiz 660 → 26/50 px)
            $("hero-img").style.filter = "drop-shadow(0 " + Math.max(3, Math.round(W * 0.04)) + "px " + Math.max(6, Math.round(W * 0.077)) + "px rgba(0, 0, 0, 0.6))";
            const S1 = PACK_BOX / Math.max(W, H);
            tl.fromTo(hero, { x: 0, y: 0, scale: 1, rotation: ROT }, { x: TILE_CX - CX, y: rowCY(1) - CY, scale: S1, rotation: 0, duration: 0.5, ease: "power3.inOut" }, 0);
            // ขั้น 1 ติดไฟ: ซองเด้งในช่อง
            tl.fromTo(hero, { scale: S1 }, { scale: S1 * 1.16, duration: 0.12, ease: "power2.out", immediateRender: false }, IG[0]);
            tl.fromTo(hero, { scale: S1 * 1.16 }, { scale: S1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, IG[0] + 0.12);
            $("ghost").remove();
          } else {
            $("hero").remove();
            const ghost = $("ghost");
            if (okSrc) {
              // คลิปพิกัด: การ์ดรูปตู้หดลงเป็นช่องไอคอนขั้น 1 (รูปจางออกเร็ว — ไม่ค้างรูปตู้บนจอ)
              // ตั้งกรอบเริ่มแบบคงที่ แล้วขยับด้วย transform เท่านั้น (left/top ปัดเป็นพิกเซลเต็ม — เรนเดอร์ทีละเฟรมแล้วกระตุก · lint error)
              ghost.style.left = CX - W / 2 + "px";
              ghost.style.top = CY - H / 2 + "px";
              ghost.style.width = W + "px";
              ghost.style.height = H + "px";
              ghost.style.transformOrigin = "50% 50%";
              tl.fromTo(ghost, { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: ROT, opacity: 1 },
                { x: TILE_CX - CX, y: rowCY(1) - CY, scaleX: TILE / W, scaleY: TILE / H, rotation: 0, duration: 0.5, ease: "power3.inOut" }, 0);
              tl.fromTo(ghost, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, 0.5);
              if (str(v.photo)) tl.fromTo("#cta-steps-ghost-img", { opacity: 1 }, { opacity: 0, duration: 0.26, ease: "power1.in" }, 0.04);
              else $("ghost-img").remove();
            } else {
              ghost.remove();
            }
            // "การ์ดลอยขึ้นจาก y+200"
            tl.fromTo("#cta-steps-list", { y: 200 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
          }

          // ── 1. ป้าย + หัวเรื่อง
          tl.fromTo("#cta-steps-label", { clipPath: "inset(-40% 100% -40% 0%)", x: -18 }, { clipPath: "inset(-40% 0% -40% 0%)", x: 0, duration: 0.3, ease: "power3.out" }, 0.1);
          if (str(v.q1)) tl.fromTo("#cta-steps-q1", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, 0.2);
          if (str(v.q2)) tl.fromTo("#cta-steps-q2", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, 0.36);

          // ── 2. เช็กลิสต์ว่าง: แถวหรี่ 45 % · ป้ายเลขเด้งบนลงล่าง · รางลากลง
          for (let k = 1; k <= 4; k++) {
            if (PACK) tl.fromTo("#cta-steps-r" + k, { opacity: 0, x: -50 }, { opacity: 0.45, x: 0, duration: 0.35, ease: "power3.out" }, 0.28 + (k - 1) * 0.1);
            else tl.fromTo("#cta-steps-r" + k, { opacity: 0 }, { opacity: 0.45, duration: 0.3, ease: "power1.out" }, 0.04 + (k - 1) * 0.06);
            tl.fromTo("#cta-steps-b" + k, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.4 + (k - 1) * 0.12);
          }
          tl.fromTo("#cta-steps-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.inOut" }, 0.4);
          tl.fromTo("#cta-steps-rail-lit", { scaleY: 0 }, { scaleY: 0, duration: 0.01, ease: "none" }, 0.4);
          [1, 2, 3].forEach((k) => tl.fromTo("#cta-steps-c" + k, { scale: 0, rotation: -40 }, { scale: 0, rotation: -40, duration: 0.01, ease: "none" }, 0.4));

          // โครงว่างวิบวับระหว่างรอ (finite · หยุดก่อนแถวนั้นติดไฟ)
          for (let k = 1; k <= 4; k++) {
            const s0 = 1.0 + (k - 1) * 0.14, cyc = 1.2;
            const cnt = Math.floor((IG[k - 1] - 0.1 - s0) / cyc);
            if (cnt >= 1) tl.fromTo("#cta-steps-r" + k + "-sk .cta-steps-shim", { xPercent: -110 }, { xPercent: 260, duration: cyc, ease: "none", repeat: cnt - 1 }, s0);
          }

          // ── 3. ติดไฟทีละขั้นตามเสียง
          const ticks = Array.from(document.querySelectorAll("#cta-steps-i2 .cta-steps-tick"));
          ticks.forEach((p) => {
            const L = p.getTotalLength();
            p.style.strokeDasharray = L;
            p.style.strokeDashoffset = L;
          });
          const sparkCols = ["#59d2ff", "#e8f7ff", "#1b8dff", "#ffc24a"];
          function burst(k, at) {
            const field = $("p" + k), parts = [];
            for (let i = 0; i < 9; i++) {
              const el = document.createElement("div");
              el.className = "cta-steps-spark";
              const size = 7 + prand(k * 41 + i * 3 + 1) * 8;
              el.style.width = size + "px";
              el.style.height = size + "px";
              el.style.marginLeft = -size / 2 + "px";
              el.style.marginTop = -size / 2 + "px";
              el.style.background = sparkCols[i % sparkCols.length];
              el.style.boxShadow = "0 0 12px " + sparkCols[i % sparkCols.length];
              field.appendChild(el);
              // ออกด้านซ้าย/บน/ล่างของป้าย (ไม่พุ่งเข้าข้อความในแถว)
              const ang = Math.PI * (0.55 + prand(k * 17 + i * 5 + 2) * 0.9) + (i % 2 ? 0 : Math.PI * 0.95);
              const sp = 260 + prand(k * 13 + i * 7 + 3) * 220;
              parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
            }
            const FL = 0.5, d = { T: 0 };
            tl.fromTo(d, { T: 0 }, {
              T: 1, duration: FL, ease: "none", immediateRender: false,
              onUpdate: () => {
                const t = d.T * FL, fade = Math.min(1, (1 - d.T) / 0.4);
                parts.forEach((p) => {
                  p.el.style.transform = "translate(" + p.vx * t + "px," + (p.vy * t + 300 * t * t) + "px)";
                  p.el.style.opacity = String(d.T === 0 || d.T === 1 ? 0 : fade);
                });
              },
            }, at);
          }

          let prevP = 0;
          for (let k = 1; k <= 4; k++) {
            const T = IG[k - 1];
            const yTo = rowCY(k), yFrom = k === 1 ? ROW_TOP[0] - 6 : rowCY(k - 1);
            // หัวสายฟ้าวิ่งลงรางถึงป้ายเลข k (0.18 วิ) · รางส่วนที่ผ่านแล้วสว่างค้าง
            tl.fromTo("#cta-steps-zap", { y: yFrom, opacity: 1 }, { y: yTo, opacity: 1, duration: 0.18, ease: "power2.in", immediateRender: false }, T - 0.18);
            tl.fromTo("#cta-steps-zap", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out", immediateRender: false }, T);
            const p = (yTo - RAIL_TOP) / RAIL_LEN;
            if (k > 1) tl.fromTo("#cta-steps-rail-lit", { scaleY: prevP }, { scaleY: p, duration: 0.18, ease: "power2.in", immediateRender: false }, T - 0.18);
            prevP = p;
            // ป้ายเลขวาบสีเน้น + วงแสง + ประกาย
            tl.fromTo("#cta-steps-b" + k + "-fl", { opacity: 0.95 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, T);
            tl.fromTo("#cta-steps-b" + k + "-ring", { scale: 0.9, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, T);
            tl.fromTo("#cta-steps-b" + k, { scale: 1 }, { scale: 1.16, duration: 0.1, ease: "power2.out", immediateRender: false }, T);
            tl.fromTo("#cta-steps-b" + k, { scale: 1.16 }, { scale: 1, duration: 0.32, ease: "back.out(2.2)", immediateRender: false }, T + 0.1);
            burst(k, T);
            // แถวติดไฟ: สว่างเต็ม · ขอบฟ้า + ขอบสีเน้น (แถวปัจจุบัน) · โครงว่างหาย
            tl.fromTo("#cta-steps-r" + k, { opacity: 0.45 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, T);
            tl.fromTo("#cta-steps-r" + k + "-lit", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, T);
            tl.fromTo("#cta-steps-r" + k + "-cur", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, T);
            tl.fromTo("#cta-steps-r" + k + "-sk", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.out" }, T);
            if (k > 1) {
              tl.fromTo("#cta-steps-r" + (k - 1) + "-cur", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.out", immediateRender: false }, T);
              tl.fromTo("#cta-steps-c" + (k - 1), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(3)", immediateRender: false }, T + 0.06);
            }
            // ไอคอนเด้ง (ขั้น 1 ของคลิปซอง = ซองฮีโร่เด้งแทน — ทำไว้ข้างบน)
            if (k > 1 || !PACK) tl.fromTo("#cta-steps-i" + k, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, T + 0.02);
            // ข้อความใหญ่กวาดเข้า (clip-path ทั้งก้อน — ไม่แยกตัวอักษร สระ/วรรณยุกต์ไม่หลุด) · ตัวเล็กตามมา 0.15 วิ
            tl.fromTo("#cta-steps-s" + k, { clipPath: "inset(-30% 100% -30% 0%)", opacity: 0, x: 26 }, { clipPath: "inset(-30% 0% -30% 0%)", opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, T + 0.04);
            tl.fromTo("#cta-steps-d" + k, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, T + 0.19);
          }

          // ── ท่าเฉพาะของไอคอน
          const T1 = IG[0], T2 = IG[1], T3 = IG[2], T4 = IG[3];
          if (!PACK) tl.fromTo("#cta-steps-tap-ring", { opacity: 0.95, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 0, scale: 2.1, duration: 0.5, ease: "power2.out", immediateRender: false }, T1 + 0.22);
          if (ticks.length) tl.to(ticks, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", stagger: 0.1 }, T2 + 0.28);
          // ขั้น 3: เส้นสแกนกวาดลงจอโทรศัพท์ครั้งเดียว แล้วหาย (ไม่ค้างบนสี่เหลี่ยม)
          tl.fromTo("#cta-steps-scan", { y: 0, opacity: 1 }, { y: 60, opacity: 1, duration: 0.5, ease: "sine.inOut", immediateRender: false }, T3 + 0.32);
          tl.fromTo("#cta-steps-scan", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, T3 + 0.82);
          // ขั้น 4: ซองหล่นลงช่องรับ
          const D0 = T4 + 0.12, CYC = 1.4;
          tl.fromTo("#cta-steps-drop", { y: -64, opacity: 1 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, D0);

          // ── 4. ป้ายลิงก์ /how-to ขึ้น + แสงกวาด
          const FOOT_T = Math.max(0.6, Math.min(T4 + 0.35, STILL - 0.4));
          if (HAS_FOOT) {
            tl.fromTo("#cta-steps-foot", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, FOOT_T);
            const G = Math.max(FOOT_T + 0.2, Math.min(T4 + 0.8, STILL - 0.45));
            if (G + 0.45 <= STILL + 1e-6) {
              const fw = Math.max(200, $("foot").offsetWidth || 820);   // กว้างของป้ายจริง (ตามข้อความ)
              tl.fromTo("#cta-steps-gloss", { x: 0 }, { x: fw * 1.35 + 110, duration: 0.45, ease: "power2.inOut" }, G);
            }
          }

          // ── 5. ช่วงค้าง: ขั้น 4 เต้น + ซองหล่นซ้ำทุก 1.4 วิ (นับรอบจาก dur · จบก่อนช่วงนิ่ง)
          for (let i = 1; ; i++) {
            const Di = D0 + CYC * i;
            if (Di + 0.45 > STILL) break;
            tl.fromTo("#cta-steps-drop", { y: 0, opacity: 1 }, { y: 20, opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, Di - 0.3);
            tl.fromTo("#cta-steps-drop", { y: -64, opacity: 1 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out", immediateRender: false }, Di);
          }
          const H0 = T4 + 0.6, reps = Math.floor((STILL - H0) / CYC);
          if (reps >= 1) {
            tl.fromTo("#cta-steps-r4-cur", { opacity: 1 }, { opacity: 0.3, duration: CYC / 2, ease: "sine.inOut", yoyo: true, repeat: reps * 2 - 1, immediateRender: false }, H0);
            tl.fromTo("#cta-steps-b4", { scale: 1 }, { scale: 1.07, duration: CYC / 2, ease: "sine.inOut", yoyo: true, repeat: reps * 2 - 1, immediateRender: false }, H0);
          }

          window.__timelines["cta-steps"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
