    บรรทัดแรก = คำถาม ("คุณเลือกซองไหน?") → หัวเรื่องกระแทก
    รอบ k: inK = เริ่มพูด "A หรือ B?"  → การ์ดสองใบเปิดเข้ามาแบบหนังสือ (3D) + ป้าย VS กระแทก

  ข้อเท็จจริง: แถบสัดส่วนมาจากยอดขายจริง · ตัวเลข % ซ่อนไว้ (shownum) จนกว่าเจ้าของจะอนุญาต

      <script>
        (function () {
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const num = (x, d) => (x != null && x !== "" && isFinite(Number(x)) ? Number(x) : d);
          const R = Math.min(3, Math.max(1, Math.round(num(v.rounds, 3))));
          const SHOWNUM = v.shownum === true || v.shownum === "true";
          const tl = gsap.timeline({ paused: true });
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const SLOT_X = { L: 0, R: 500 };              // ช่องซ้าย/ขวา (panel วางที่ left 60)
          const PANEL_CX = { L: 290, R: 790 }, PANEL_CY = 940;

          // ── ใครอยู่ฝั่งไหน: รอบ 1 = 1 (ซ้าย) vs 2 (ขวา) · ผู้ท้าชิงรอบถัดไปเข้าฝั่งของผู้แพ้
          const rounds = [];
          const side = { 1: "L", 2: "R" };
          let champ = null;
          for (let k = 1; k <= R; k++) {
            const a = k === 1 ? 1 : champ;
            const b = k === 1 ? 2 : k + 1;
            if (k > 1) side[b] = side[a] === "L" ? "R" : "L";
            let w = Math.round(num(v["win" + k], a));
            if (w !== a && w !== b) w = a;
            const IN = num(v["in" + k], 2.3 + (k - 1) * 3.6);
            const RV = Math.max(IN + 0.6, num(v["rv" + k], IN + 2.0));
            const left = side[a] === "L" ? a : b;
            rounds.push({ k, a, b, w, l: w === a ? b : a, IN, RV, shL: Math.min(1, Math.max(0, num(v["sh" + k], 0.5))), left });
            champ = w;
          }

          // ── 1. หัวเรื่อง
          tl.fromTo("#vs-kicker", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.05);
          tl.fromTo("#vs-q1", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, 0.12);
          tl.fromTo("#vs-q2", { scale: 2.1, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, 0.3);
          tl.fromTo("#vs-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.6);

          // ช่องว่าง ? สองฝั่งโผล่ระหว่างคำถาม แล้วหายตอนการ์ดรอบแรกเข้า
          const IN1 = rounds[0].IN;
          tl.fromTo(["#vs-ghost-l", "#vs-ghost-r"], { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", stagger: 0.08 }, 0.55);
          tl.fromTo(["#vs-ghost-l", "#vs-ghost-r"], { rotation: -1.5 }, { rotation: 1.5, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((IN1 - 1.2) / 0.5) - 1), immediateRender: false }, 1.0);
          tl.to(["#vs-ghost-l", "#vs-ghost-r"], { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, IN1 - 0.05);

          const bolt = document.getElementById("vs-bolt-p");
          const BL = bolt.getTotalLength();
          bolt.style.strokeDasharray = BL;
          bolt.style.strokeDashoffset = BL;

          function enter(c, at) {
            const s = side[c], dir = s === "L" ? -1 : 1;
            tl.fromTo("#vs-c" + c,
              { x: SLOT_X[s] + dir * 720, rotationY: dir * -55, rotation: dir * 8, opacity: 1, transformPerspective: 1400 },
              { x: SLOT_X[s], rotationY: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out", transformPerspective: 1400 }, at);
          }
          function burst(k, cx, at) {
            const field = document.getElementById("vs-p" + k);
            field.style.left = cx + "px";
            field.style.top = PANEL_CY + "px";
            const cols = ["#ffc24a", "#fff1b8", "#ffffff", "#59d2ff"];
            const parts = [];
            for (let i = 0; i < 20; i++) {
              const el = document.createElement("div");
              el.className = "vs-spark";
              const size = 9 + prand(k * 71 + i * 3 + 1) * 13;
              el.style.width = size + "px";
              el.style.height = size + "px";
              el.style.background = cols[i % cols.length];
              el.style.boxShadow = "0 0 16px " + cols[i % cols.length];
              field.appendChild(el);
              const ang = prand(k * 37 + i * 5 + 2) * Math.PI * 2;
              const sp = 560 + prand(k * 17 + i * 7 + 3) * 560;
              parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
            }
            const FL = 0.7, d = { T: 0 };
            tl.fromTo(d, { T: 0 }, {
              T: 1, duration: FL, ease: "none", immediateRender: false,
              onUpdate: () => {
                const t = d.T * FL, fade = Math.min(1, (1 - d.T) / 0.35);
                parts.forEach((p) => {
                  p.el.style.transform = "translate(" + p.vx * t + "px," + (p.vy * t + 260 * t * t) + "px)";
                  p.el.style.opacity = String(d.T === 0 ? 0 : fade);
                });
              },
            }, at);
          }

          rounds.forEach((rd, i) => {
            const { k, a, b, w, l, IN, RV, shL } = rd;
            const next = rounds[i + 1];
            // ── เข้า: รอบแรกเข้าทั้งคู่ · รอบต่อไปเข้าเฉพาะผู้ท้าชิง
            if (k === 1) { enter(a, IN); enter(b, IN + 0.08); }
            else enter(b, IN);
            tl.fromTo("#vs-badge", { scale: 3, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "power4.out", immediateRender: k === 1 }, IN + 0.25);
            tl.fromTo(bolt, { strokeDashoffset: BL, opacity: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, IN + 0.25);
            tl.to(bolt, { opacity: 0, duration: 0.25, ease: "power1.out" }, IN + 0.4);
            // ── เฉลย: แถบสัดส่วน → ผู้ชนะสว่าง/มงกุฎ · ผู้แพ้หรี่
            tl.fromTo("#vs-bar", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, RV - 0.2);
            tl.fromTo("#vs-bar-l", { scaleX: 0 }, { scaleX: shL, duration: 0.5, ease: "power3.out", immediateRender: false }, RV - 0.15);
            tl.fromTo("#vs-bar-r", { scaleX: 0 }, { scaleX: 1 - shL, duration: 0.5, ease: "power3.out", immediateRender: false }, RV - 0.15);
            if (SHOWNUM) {
              // ป้าย % แยกต่อรอบ ตั้งข้อความตอนประกอบ (tl.call ไม่ทำงานเมื่อเรนเดอร์กระโดดข้ามเวลา)
              const mk = (cls, txt) => {
                const el = document.createElement("div");
                el.className = "vs-pct " + cls;
                el.textContent = txt;
                document.getElementById("vs-arena").appendChild(el);
                return el;
              };
              rd.pct = [mk("vs-pct-l", Math.round(shL * 100) + "%"), mk("vs-pct-r", Math.round((1 - shL) * 100) + "%")];
              tl.fromTo(rd.pct, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, RV - 0.1);
            }
            const ws = side[w];
            tl.fromTo("#vs-c" + w, { scale: 1 }, { scale: 1.07, duration: 0.4, ease: "back.out(2)", immediateRender: false }, RV + 0.3);
            tl.fromTo("#vs-l" + w, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", immediateRender: false }, RV + 0.3);
            tl.fromTo("#vs-w" + w, { y: -110, opacity: 0, rotation: -20 }, { y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "bounce.out", immediateRender: false }, RV + 0.32);
            tl.fromTo("#vs-h" + w, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, RV + 0.45);
            burst(k, PANEL_CX[ws], RV + 0.32);
            tl.to("#vs-c" + l, { scale: 0.9, opacity: 0.5, duration: 0.35, ease: "power2.out" }, RV + 0.3);
            tl.fromTo("#vs-k" + l, { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(0.65)", duration: 0.35, ease: "power2.out", immediateRender: false }, RV + 0.3);
            if (next) {
              // ── ล้างรอบ: ผู้แพ้ถูกเหวี่ยงออก · ผู้ชนะกลับขนาดเดิม · แถบรีเซ็ต
              const T0 = next.IN - 0.22, dir = side[l] === "L" ? -1 : 1;
              tl.to("#vs-c" + l, { x: SLOT_X[side[l]] + dir * 820, rotation: dir * 32, opacity: 0, duration: 0.32, ease: "power2.in" }, T0);
              tl.to("#vs-c" + w, { scale: 1, duration: 0.3, ease: "power2.inOut" }, T0);
              tl.to(["#vs-l" + w, "#vs-w" + w, "#vs-h" + w], { opacity: 0, duration: 0.2, ease: "power1.out" }, T0);
              tl.to("#vs-bar", { opacity: 0, duration: 0.2, ease: "power1.out" }, T0);
              tl.to("#vs-badge", { scale: 0.6, opacity: 0, duration: 0.18, ease: "power2.in" }, T0);
              if (rd.pct) tl.to(rd.pct, { opacity: 0, duration: 0.2 }, T0);
            } else {
              // ── รอบสุดท้าย: ป้าย "ซื้อมากกว่า" เปลี่ยนเป็นป้ายแชมป์เหนือการ์ดผู้ชนะ (เดิมสองป้ายทับกันกลางจอ)
              tl.to("#vs-h" + w, { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in" }, RV + 0.72);
              const fx = PANEL_CX[ws] - 540;
              tl.fromTo("#vs-final", { x: fx, scale: 2.4, opacity: 0, filter: "blur(10px)" }, { x: fx, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, RV + 0.8);
            }
          });

          window.__timelines["fmt-versus"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
