<!doctype html>
<!--
  fmt-quiz — "ทายซิ ซองนี้ชุดอะไร?" · เลนส์ซูมลายบนซองจนจำไม่ได้ → นับถอยหลัง → เฉลยเต็มซอง

  ทำไมรูปแบบนี้ (ผลสำรวจตลาด 16 ต.ค. 2026):
    คลิปทาย/ควิซในวงการทำวิวสูงกว่าคลิปโชว์สินค้าหลายเท่า — "คลิปทายการ์ดวันพีช" 1.37M · ควิซเรือโจรสลัด 775K ·
    ควิซของเพจทางการ One Piece CG 154K (คลิปโชว์ซองของเพจเดียวกัน ~1K) · มีคำถามค้างบนจอ = คนดูอยู่จนเฉลย
    ใช้รูปซองอย่างเดียว (มีสิทธิ์) · ไม่ใช้หน้าการ์ด

  จังหวะ (วินาทีภายในฉาก):
    บรรทัด 0 คำถาม → เลนส์เปิด ซูมลึกบนลายซอง (เบลอ) + HUD สแกน
    บรรทัด 1 "…สาม สอง หนึ่ง" → cd3/cd2/cd1 = เวลาที่พูดแต่ละเลข · เลนส์ค่อย ๆ ถอยออก/ชัดขึ้นทีละขั้น
    บรรทัด 2 "เฉลย! …" → rv = เวลาที่พูดชื่อชุด · แสงวาบ เลนส์แตกออก ซองเต็มกระแทก + ชื่อ
  zx/zy = จุดซูมบนรูป (% — hf_render เลือกกลางลายซอง ห่างรหัสชุดที่มุมบน) · z0 = ซูมเริ่ม (เท่าของภาพเต็มเลนส์)
-->

  lang="th"
  data-composition-variables='[

    {"id":"qs2","type":"number","label":"ขนาดหัวเรื่องบรรทัด 2 (px)","default":118,"min":48,"max":118,"step":1},

    {"id":"sub","type":"string","label":"คำใบ้","default":"ใบ้ให้: ซอง One Piece"},
    {"id":"prompt","type":"string","label":"ป้ายชวนตอบ","default":"พิมพ์คำตอบในคอมเมนต์!"},

  <head>

  <body>
    <template>
      <style>
        @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-Black.ttf"); font-weight: 900; }
        @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-ExtraBold.ttf"); font-weight: 800; }
        @font-face { font-family: "Kanit"; src: url("assets/fonts/Kanit-SemiBold.ttf"); font-weight: 600; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Kanit", sans-serif; color: #ffffff; }
        #quiz-head { position: absolute; left: 0; right: 0; top: 186px; z-index: 6; }
        #quiz-kicker-row { display: flex; justify-content: center; }
        #quiz-kicker {
          display: block; padding: 8px 34px 12px; border-radius: 999px; background: #1b8dff;

        }
        #quiz-q1 { --qmt: 14px; margin-top: var(--qmt); font-size: 104px; }
        #quiz-q2 { font-size: 118px; color: var(--hot, #ffc24a); }
        #quiz-sub { display: block; margin-top: 6px; text-align: center; font-weight: 600; font-size: 36px; line-height: 1.3; color: #9fc4e8; }
        /* ── เลนส์: วงกลม 700 กึ่งกลาง (540, 950) */
        #quiz-lens { position: absolute; left: 190px; top: 600px; width: 700px; height: 700px; z-index: 2; will-change: transform, opacity; }
        #quiz-lens-mask { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #061b3a; }
        #quiz-zoom { position: absolute; left: 350px; top: 350px; width: 0; height: 0; will-change: transform, filter; }
        #quiz-zoom img { position: absolute; width: 2400px; height: 2400px; object-fit: contain; }
        #quiz-scan {
          position: absolute; left: 0; top: 0; width: 700px; height: 120px;
          background: linear-gradient(180deg, rgba(89, 210, 255, 0) 0%, rgba(89, 210, 255, 0.35) 50%, rgba(89, 210, 255, 0) 100%);

        }
        #quiz-rim { position: absolute; inset: -10px; border-radius: 50%; border: 10px solid #59d2ff; box-shadow: 0 0 50px #1b8dff, inset 0 0 40px rgba(27, 141, 255, 0.7); }

        .quiz-corner { position: absolute; width: 90px; height: 90px; border: 0 solid #e8f7ff; filter: drop-shadow(0 0 10px #59d2ff); }
        #quiz-c1 { left: -70px; top: -70px; border-top-width: 8px; border-left-width: 8px; border-top-left-radius: 18px; }
        #quiz-c2 { right: -70px; top: -70px; border-top-width: 8px; border-right-width: 8px; border-top-right-radius: 18px; }
        #quiz-c3 { left: -70px; bottom: -70px; border-bottom-width: 8px; border-left-width: 8px; border-bottom-left-radius: 18px; }

        #quiz-qmark {

        }
        /* ── ป้ายชวนตอบ + วงนับถอยหลัง */

        #quiz-prompt-pill {
          display: block; padding: 8px 36px 14px; border-radius: 999px; background: #ffc24a; color: #03102a;
          font-weight: 900; font-size: 46px; line-height: 1.2; box-shadow: 0 0 34px rgba(255, 194, 74, 0.8); white-space: nowrap;
        }
        /* ซ้ายล่างนอกวงเลนส์ — ไม่ทับมุมกรอบ HUD และป้ายชวนตอบ */
        #quiz-cd { position: absolute; left: 24px; top: 1050px; width: 190px; height: 190px; z-index: 4; opacity: 0; will-change: transform, opacity; }
        #quiz-cd svg { position: absolute; inset: 0; width: 190px; height: 190px; overflow: visible; }
        #quiz-cd-track { fill: rgba(3, 16, 42, 0.92); stroke: rgba(89, 210, 255, 0.35); stroke-width: 12; }
        #quiz-cd-arc { fill: none; stroke: #ffc24a; stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 10px #ffc24a); }
        .quiz-num { position: absolute; inset: 0; text-align: center; font-weight: 900; font-size: 116px; line-height: 186px; color: #ffffff; opacity: 0; will-change: transform, opacity; }
        /* ── เฉลย */
        #quiz-flash { position: absolute; inset: 0; z-index: 5; background: radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.95), rgba(255, 220, 140, 0.6) 40%, rgba(255, 194, 74, 0) 75%); opacity: 0; pointer-events: none; }
        #quiz-reveal { position: absolute; left: 210px; top: 548px; width: 660px; height: 660px; z-index: 3; opacity: 0; will-change: transform, opacity; }
        #quiz-reveal img { position: absolute; inset: 0; width: 660px; height: 660px; object-fit: contain; filter: drop-shadow(0 26px 50px rgba(0, 0, 0, 0.6)); }
        #quiz-burst-ring { position: absolute; left: 330px; top: 330px; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; border: 12px solid #ffc24a; box-shadow: 0 0 70px #ffc24a; opacity: 0; }
        #quiz-ans { position: absolute; left: 0; right: 0; top: 1168px; z-index: 4; text-align: center; opacity: 0; will-change: transform, opacity; }
        #quiz-name {
          display: block; font-weight: 900; line-height: 1.02; white-space: nowrap;
          background: linear-gradient(180deg, #fff4c9 0%, #ffc24a 45%, #fff1b8 68%, #c98a12 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 6px 0 #03102a) drop-shadow(0 0 30px rgba(255, 194, 74, 0.7));
        }
        .quiz-sparks { position: absolute; left: 540px; top: 878px; width: 0; height: 0; z-index: 4; }
        .quiz-spark { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; will-change: transform, opacity; }
        #quiz-sub:empty, #quiz-kicker:empty, #quiz-prompt-pill:empty, #quiz-name:empty { display: none; }
      </style>

      <div id="root" data-composition-id="fmt-quiz" data-width="1080" data-height="1920">
        <div id="quiz-lens">
          <div id="quiz-lens-mask">
            <div id="quiz-zoom"><img id="quiz-zimg" data-var-src="img" src="assets/packs/op-15.webp" alt="" /></div>
            <div id="quiz-scan"></div>
            <div id="quiz-qmark" aria-hidden="true" data-layout-ignore>?</div>
          </div>
          <div id="quiz-rim"></div>
          <svg id="quiz-dash" viewBox="0 0 792 792" aria-hidden="true" data-layout-ignore><circle cx="396" cy="396" r="380" /></svg>
          <div class="quiz-corner" id="quiz-c1"></div>
          <div class="quiz-corner" id="quiz-c2"></div>
          <div class="quiz-corner" id="quiz-c3"></div>
          <div class="quiz-corner" id="quiz-c4"></div>
        </div>
        <div id="quiz-reveal"><div id="quiz-burst-ring"></div><img data-var-src="img" src="assets/packs/op-15.webp" alt="" /></div>
        <div class="quiz-sparks" id="quiz-p"></div>
        <div id="quiz-ans" data-layout-allow-occlusion><span id="quiz-name" data-var-text="name" style="font-size: calc(var(--fs) * 1px)">OP-15</span></div>
        <div id="quiz-prompt"><div id="quiz-prompt-pill" data-var-text="prompt">พิมพ์คำตอบในคอมเมนต์!</div></div>
        <div id="quiz-cd">
          <svg viewBox="0 0 190 190" aria-hidden="true" data-layout-ignore><circle id="quiz-cd-track" cx="95" cy="95" r="82" /><circle id="quiz-cd-arc" cx="95" cy="95" r="82" transform="rotate(-90 95 95)" /></svg>
          <div class="quiz-num" id="quiz-n3">3</div>
          <div class="quiz-num" id="quiz-n2">2</div>
          <div class="quiz-num" id="quiz-n1">1</div>
        </div>
        <div id="quiz-flash"></div>
        <div id="quiz-head" class="dvx-head">
          <div id="quiz-kicker-row"><div id="quiz-kicker" class="dvx-kick" data-var-text="kicker">QUIZ · ทายชุด</div></div>
          <div class="quiz-q dvx-q dvx-q1" id="quiz-q1" data-var-text="q1" style="font-size: calc(var(--qs1, 104) * 1px)">ทายซิ!</div>
          <div class="quiz-q dvx-q dvx-q2" id="quiz-q2" data-var-text="q2" style="font-size: calc(var(--qs2, 118) * 1px)">ซองนี้ชุดอะไร?</div>
          <div id="quiz-sub" data-var-text="sub">ใบ้ให้: ซอง One Piece</div>

      <script>
        (function () {
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const num = (x, d) => (x != null && x !== "" && isFinite(Number(x)) ? Number(x) : d);
          const DUR = Math.max(1, num(v.dur, 8.5));
          const RV = Math.min(DUR - 0.6, num(v.rv, 6.3));
          const CD3 = num(v.cd3, RV - 3.0), CD2 = Math.max(CD3 + 0.3, num(v.cd2, CD3 + 0.8)), CD1 = Math.max(CD2 + 0.3, num(v.cd1, CD2 + 0.8));
          const ZX = num(v.zx, 50) / 100, ZY = num(v.zy, 34) / 100, Z0 = Math.max(1, num(v.z0, 4.2));
          const tl = gsap.timeline({ paused: true });
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };

          // ── จุดซูม: รูป 2400 วางให้จุด (ZX, ZY) อยู่กลางเลนส์ · ขยาย/ย่อที่ตัวห่อขนาด 0 (= หมุนรอบจุดนั้น)
          const S = 2400, FIT = 700 / S;
          const img = document.getElementById("quiz-zimg");
          img.style.left = -ZX * S + "px";
          img.style.top = -ZY * S + "px";
          // ซูม z เท่าของ "ภาพเต็มเลนส์" รอบจุด (ZX, ZY) — ตอนเฉลยใช้รูปอีกชุด (#quiz-reveal) จึงไม่ต้องเลื่อนกลับกลาง
          const at = (z) => ({ scale: FIT * z });

          // ── 1. หัวเรื่อง + เลนส์เปิด
          tl.fromTo("#quiz-kicker", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.05);
          tl.fromTo("#quiz-q1", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power4.out" }, 0.12);
          tl.fromTo("#quiz-q2", { scale: 2.1, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, 0.3);
          tl.fromTo("#quiz-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.65);
          tl.fromTo("#quiz-lens", { scale: 0.2, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.5)" }, 0.2);
          tl.fromTo(".quiz-corner", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.05 }, 0.55);
          // ซูมลึก เบลอ แล้วค่อย ๆ ลอยสำรวจลาย (เลนส์ "กำลังสแกน")
          const z0 = at(Z0);
          tl.fromTo("#quiz-zoom", { scale: z0.scale * 1.25, rotation: -6, filter: "blur(16px)" },
            { scale: z0.scale, rotation: 4, filter: "blur(12px)", duration: Math.max(0.5, CD3 - 0.2), ease: "sine.inOut" }, 0.2);
          tl.fromTo("#quiz-scan", { y: -120 }, { y: 700, duration: 1.1, ease: "none", repeat: Math.max(0, Math.floor((RV - 0.4) / 1.1) - 1) }, 0.4);
          tl.fromTo("#quiz-dash", { rotation: 0 }, { rotation: 90, duration: RV, ease: "none" }, 0);
          tl.fromTo("#quiz-qmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.6);

          // ── 2. นับถอยหลัง: เลนส์ถอยออกทีละขั้น ชัดขึ้นทีละนิด (ยังจำยาก) · วงลดลงตามเวลา
          tl.fromTo("#quiz-prompt", { scale: 0.3, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(2.2)" }, CD3 - 0.35);
          tl.fromTo("#quiz-cd", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, CD3 - 0.3);
          const arc = document.getElementById("quiz-cd-arc");
          const C = 2 * Math.PI * 82;
          arc.style.strokeDasharray = C;
          tl.fromTo(arc, { strokeDashoffset: 0 }, { strokeDashoffset: C, duration: RV - CD3, ease: "none" }, CD3);
          // ถอยออกทีละนิดแต่ยัง "ไม่เห็นชื่อชุด" — รอบแรกถอยถึง 1.5 เท่าแล้วเห็นชื่อชุดญี่ปุ่นบนซองตั้งแต่เลข 2
          const steps = [["#quiz-n3", CD3, CD2, Z0 * 0.86, 10], ["#quiz-n2", CD2, CD1, Z0 * 0.72, 7], ["#quiz-n1", CD1, RV - 0.05, Z0 * 0.6, 4.5]];
          steps.forEach(([sel, a, b, z, blur], i) => {
            tl.fromTo(sel, { opacity: 1, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, a);
            tl.set(sel, { opacity: 0 }, b);
            tl.fromTo("#quiz-cd", { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out", immediateRender: false }, a);
            tl.to("#quiz-cd", { scale: 1, duration: 0.3, ease: "power3.out" }, a + 0.08);
            const zz = at(z);
            tl.to("#quiz-zoom", { scale: zz.scale, rotation: i % 2 ? 3 : -3, filter: "blur(" + blur + "px)", duration: 0.35, ease: "power3.out" }, a);
            tl.fromTo("#quiz-lens", { x: 0 }, { x: (i % 2 ? 1 : -1) * 10, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, a);
          });

          // ── 3. เฉลย: แสงวาบ → เลนส์แตกออก → ซองเต็มกระแทก + ชื่อทอง
          tl.fromTo("#quiz-flash", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, RV - 0.06);
          tl.to("#quiz-flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, RV);
          tl.to("#quiz-lens", { scale: 1.5, opacity: 0, duration: 0.3, ease: "power2.out" }, RV - 0.04);
          tl.to(["#quiz-prompt", "#quiz-cd"], { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, RV - 0.04);
          tl.fromTo("#quiz-reveal", { scale: 1.6, opacity: 0, rotation: 10, filter: "blur(18px)" }, { scale: 1, opacity: 1, rotation: -3, filter: "blur(0px)", duration: 0.32, ease: "back.out(1.6)" }, RV);
          tl.fromTo("#quiz-burst-ring", { scale: 0.3, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, RV + 0.08);
          tl.fromTo("#quiz-ans", { scale: 2.2, opacity: 0, y: -30 }, { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power4.out" }, RV + 0.16);
          tl.fromTo("#quiz-q2", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", immediateRender: false }, RV + 0.1);
          tl.to("#quiz-q2", { scale: 1, duration: 0.3, ease: "power3.out" }, RV + 0.2);
          // ประกาย (seeded)
          const field = document.getElementById("quiz-p");
          const cols = ["#ffc24a", "#fff1b8", "#ffffff", "#59d2ff"];
          const parts = [];
          for (let i = 0; i < 26; i++) {
            const el = document.createElement("div");
            el.className = "quiz-spark";
            const size = 9 + prand(i * 3 + 11) * 15;
            el.style.width = size + "px";
            el.style.height = size + "px";
            el.style.background = cols[i % cols.length];
            el.style.boxShadow = "0 0 16px " + cols[i % cols.length];
            field.appendChild(el);
            const ang = prand(i * 5 + 13) * Math.PI * 2;
            const sp = 650 + prand(i * 7 + 17) * 650;
            parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
          }
          const FL = 0.75, d = { T: 0 };
          tl.fromTo(d, { T: 0 }, {
            T: 1, duration: FL, ease: "none", immediateRender: false,
            onUpdate: () => {
              const t = d.T * FL, fade = Math.min(1, (1 - d.T) / 0.35);
              parts.forEach((p) => {
                p.el.style.transform = "translate(" + p.vx * t + "px," + (p.vy * t + 260 * t * t) + "px)";
                p.el.style.opacity = String(d.T === 0 ? 0 : fade);
              });
            },
          }, RV + 0.08);
          // ซองลอยเบา ๆ หลังเฉลย (finite)
          const rest = DUR - (RV + 0.45);
          if (rest > 0.4) {
            tl.fromTo("#quiz-reveal", { y: 0 }, { y: -18, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(rest / 0.9) - 1), immediateRender: false }, RV + 0.45);
          }

          window.__timelines["fmt-quiz"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
