<!doctype html>
<!--
  cta-line — ฉากปิด "ติดปัญหาที่ตู้ / มีคำถาม → ทักไลน์" (layout "line" · 16 ต.ค. 2026 · เปลี่ยนความหมาย 17 ต.ค.)

  ทำไมแบบนี้: เจ้าของ 17 ต.ค. — "ตอนนี้ในไลน์ไม่ได้ใช้บรอดแคสต์ ส่วนใหญ่ในไลน์เป็นการรับแจ้งปัญหาจากลูกค้า"
    ฉบับแรก ("ข่าวเติมของหน้าตู้ เราแจ้งทางไลน์" + กระดิ่งดัง + จุดแดงแจ้งเตือน) จึงอ้างสิ่งที่ไม่ได้ทำ
    → ตอนนี้ไลน์ OA @divisionxcard คือช่องทางติดต่อ: กดตู้แล้วติดปัญหา / มีคำถาม ทักมาได้
    (ตรงกับกล่อง "มีปัญหา?" ในหน้า /how-to) · ไม่สัญญาเวลาตอบ ไม่อ้างข่าว/เติมของ — hf_cta.cta_check ตรวจ (LINE_BANNED)
    · ไม่ใช้ข้อมูลสต็อก จึงจริงเสมอทุกรูปแบบคลิป
  ไอคอน: ฟองแชตฟ้าขอบกรมท่า + จุด 3 จุด "…" = ทักมาคุยกับเรา (กระดิ่ง = แจ้งเตือน/บรอดแคสต์ ซึ่งไม่มีจริง — ถอดออกพร้อมจุดแดง/คลื่นเสียง)
    จุดผุดครั้งเดียวแล้วนิ่ง — ไม่ไล่เป็นคลื่น (คลื่นคือสัญญาณ "อีกฝั่งกำลังพิมพ์" = เหมือนสัญญาว่ามีคนตอบอยู่ตอนนี้)
    ฟองผุดจากมุมขวาบนของการ์ด QR (โตจากปลายหาง (772, 574) — หางเริ่มที่ x 770 ห่างวงแสงขอบการ์ด (x 760–764) 5 px)
    · ตัวฟองอยู่บนการ์ดแต่ไม่แตะ · แสงฟ้าของฟองอยู่ใต้การ์ด (การ์ดขาวทึบบังเองทุกเฟรม)
    · วัดพิกเซล 17 ต.ค.: พื้นที่ขาวของการ์ด = ตอนซ่อนฟองทุกพิกเซล — รายละเอียดที่ CSS ฟองข้างล่าง
  ไม่มีรูปซองในฉากนี้ (สเปก): จึงไม่มี match cut จากซองฉากก่อน (ตัวแปร src ไม่ได้ใช้) — รอยต่อเป็นแสงวาบของ host อย่างเดียว

  QR: assets/brand/line-qr.svg (ตรวจถอดแล้ว → https://lin.ee/9cMKVRm) · 33 โมดูลรวมขอบเงียบ 4 โมดูล
    วาด 13 px/โมดูล = 429 px บนการ์ดขาว 440 ที่พิกัดเต็มพิกเซล (325, 525) → ขอบโมดูลคม ไม่มีอะไรทับตัวโค้ด
    การ์ดตอนนิ่ง transform เหลือ 2D ศูนย์ (มุมมอง 3D อยู่ที่ตัวห่อ ไม่ใช่การ์ด) · ไม่ใส่ will-change บนการ์ด/รูป
    ครึ่งวินาทีสุดท้ายนิ่งสนิท แคปหน้าจอแล้วสแกนในแอป LINE ได้

  จังหวะ: 0.10 q1 กระแทก · 0.28 q2 · 0.40–0.95 การ์ด QR ลอยขึ้น (ท่าการ์ดรูปตู้ของ fmt-map) · 0.62 ฟองแชตผุด
    · 0.78 จุด 3 จุดผุดทีละจุด (แล้วนิ่ง) · 0.85 กรอบสแกนหดเข้าจาก 1.3 เท่า + เส้นสแกนกวาดครั้งเดียว · 1.10 ไอดีกวาดเข้า (clip-path)
    · 1.40 คำแนะนำขึ้น · 1.8 → dur−0.5 กรอบหายใจ (นับรอบจาก dur · จบที่ท่าพัก)
  สีเขียว LINE เฉพาะชิปเล็ก (ตัวหนังสือกรมท่า — ขาวบนเขียวคอนทราสต์ไม่ถึงเกณฑ์) · ไม่มี UI แชตปลอม (ไม่มีข้อความตอบกลับ)
-->

                · ฉบับก่อน (748, 466) เอียง −4° ชั้นเดียวบนการ์ด → ทับการ์ด 5.4 px: ขอบ+เงากรมท่าลงมุมขอบเงียบ QR (x 747–753 · y 530–545)
                  และแสงย้อมการ์ดขาวในขอบเงียบ 3,486 px (ใกล้ตัวโค้ดสุด 1.2 โมดูล)
                · เลื่อน +6 อย่างเดียว ชิดขอบการ์ดพอดี (0 px) · ไม่เอียงอย่างเดียว ยังทับ 2.2 px · ทำทั้งคู่ ห่าง 3.15 px

              ต่ำกว่าหัวเรื่อง q2 พอให้สระล่าง+เงาของคำท้ายบรรทัด (เช่น "ตู้" ของ L3 ปลายถึง x 864) ไม่ทับฟอง

      <script>
        (function () {
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const num = (x, d) => (x != null && x !== "" && isFinite(Number(x)) ? Number(x) : d);
          const DUR = Math.max(1, num(v.dur, 5.4));
          const END = DUR - 0.5;                                      // จากตรงนี้ถึงจบ นิ่งสนิท (แคปแล้วสแกนได้)
          // จังหวะเข้าทั้งชุดจบที่ 1.75 วิ · ฉากสั้นผิดปกติ → ย่อทั้งชุดให้จบก่อนช่วงนิ่ง
          const K = Math.max(0.5, Math.min(1, (END - 0.05) / 1.75));
          const T = (t) => t * K;
          const tl = gsap.timeline({ paused: true });

          // ── 1. หัวเรื่องกระแทก (kinetic-beat-slam แบบเดียวกับ fmt-*)
          tl.fromTo("#cta-line-q1", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36 * K, ease: "power4.out" }, T(0.1));
          tl.fromTo("#cta-line-q2", { scale: 1.8, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4 * K, ease: "power4.out" }, T(0.28));

          // ── 2. การ์ด QR ลอยขึ้น (ท่าการ์ดรูปตู้ของ fmt-map) — มุมมอง 3D มาจากตัวห่อ ตอนนิ่งการ์ดจึงไม่มี transform 3D ค้าง
          tl.fromTo("#cta-line-card", { y: 300, rotationX: 30, scale: 0.86, opacity: 0 }, { y: 0, rotationX: 0, scale: 1, opacity: 1, duration: 0.55 * K, ease: "power3.out" }, T(0.4));

          // ── 3. ฟองแชตผุดจากมุมการ์ด (โตจากปลายหาง · เด้งนุ่ม ไม่สั่น · พักตรง 0° — ถ้าพักเอียง −4° มุมล่างซ้ายแตะขอบการ์ด)
          //       แล้วจุด 3 จุดผุดทีละจุด = "…" ครั้งเดียว แล้วนิ่งถึงจบ (ไม่ไล่เป็นคลื่นแบบ "กำลังพิมพ์" — ไม่สัญญาว่ามีคนตอบอยู่ตอนนี้)
          tl.fromTo(".cta-line-chat", { scale: 0.2, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.34 * K, ease: "back.out(1.7)" }, T(0.62));   // ตัวฟอง + แสงใต้การ์ด
          ["#cta-line-typ1", "#cta-line-typ2", "#cta-line-typ3"].forEach((d, i) => {
            tl.fromTo(d, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2 * K, ease: "back.out(2.4)" }, T(0.78 + i * 0.07));
          });

          // ── 4. กรอบสแกนหดเข้าจาก 1.3 เท่า + เส้นสแกนกวาดลงครั้งเดียว แล้วหายนอกการ์ด (ไม่ค้างบนโค้ด)
          tl.fromTo("#cta-line-frame", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25 * K, ease: "power4.out" }, T(0.85));
          const SCAN = 0.6 * K;
          tl.fromTo("#cta-line-scan", { y: -130, opacity: 1 }, { y: 450, opacity: 1, duration: SCAN, ease: "power1.inOut", immediateRender: false }, T(0.85));
          tl.set("#cta-line-scan", { opacity: 0 }, T(0.85) + SCAN + 0.02);

          // ── 5. ไอดีกวาดเข้า (clip-path ทั้งก้อน ไม่แยกตัวอักษร · ขอบลบไว้ไม่ให้ตัดขอบตัวหนังสือ/แสงตอนนิ่ง) + คำแนะนำขึ้น
          // ต้นทาง: ขอบขวา 112% = ขอบซ้าย −12% พอดี → ปิดสนิท (เดิม 100% เหลือแถบ −12%…0 ให้แสงชิปโผล่เป็นเส้นเขียว)
          const W0 = T(1.1), WIPE = 0.4 * K;
          tl.fromTo("#cta-line-idbox", { clipPath: "inset(-60% 112% -60% -12%)" }, { clipPath: "inset(-60% -12% -60% -12%)", duration: WIPE, ease: "power2.inOut" }, W0);
          // แสงขอบวิ่งตามขอบ clip (−12% → 112% ของความกว้างก้อน · ease เดียวกัน) แล้วดับ
          tl.fromTo("#cta-line-idglint", { xPercent: -12 }, { xPercent: 112, duration: WIPE, ease: "power2.inOut" }, W0);
          tl.fromTo("#cta-line-idglint", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, W0);
          tl.fromTo("#cta-line-idglint", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false }, W0 + WIPE - 0.04);
          tl.fromTo("#cta-line-hint", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35 * K, ease: "power2.out" }, T(1.4));

          // ── 6. ช่วงค้าง (finite · นับจาก dur): กรอบหายใจเป็นคู่ไป-กลับ จบที่ขนาดเดิมก่อน END · ฟอง/จุดนิ่งแล้วตั้งแต่ ≈1.1 วิ
          const P0 = Math.max(1.8, T(0.85) + 0.25 * K + 0.05), HALF = 0.75;
          const halves = 2 * Math.floor(Math.max(0, END - P0) / (2 * HALF));
          if (halves >= 2) {
            tl.fromTo("#cta-line-frame", { scale: 1 }, { scale: 1.03, duration: HALF, ease: "sine.inOut", yoyo: true, repeat: halves - 1, immediateRender: false }, P0);
          }

          window.__timelines["cta-line"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
