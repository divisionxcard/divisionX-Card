<!doctype html>
<!-- ฉากเปิดแบรนด์ — สายฟ้าผ่ากลางจอ วาบแสง แล้วชื่อโครเมียมสไลด์เข้า
     ใช้เป็น visuals ของฉากแรก (เสียงประโยคแรกเล่าทับ) · กติกาเดียวกับ showcase:
     CSS animation ล้วน + PRNG seed คงที่ · หลังวินาทีที่ ~1.4 ทุกอย่างเข้าที่
     เหลือแค่ไอเดิล (แสงหายใจ อนุภาค) — ฉากยาวเท่าไหร่ก็ดูดี -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "SarabunDX"; src: url("{{FONT_BOLD}}"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body {
    font-family: "SarabunDX", sans-serif;
    background: radial-gradient(130% 80% at 50% 38%, #10294f 0%, #0a1a3a 55%, #04091a 100%);
    position: relative;
  }

  /* วาบแสงทั้งจอตอนสายฟ้าลง (0.30-0.55 วิ) แล้วดับสนิท */
  .flash {
    position: absolute; inset: 0;
    background: radial-gradient(75% 55% at 50% 42%, rgba(200,240,255,.95), rgba(61,220,255,.35) 55%, transparent 80%);
    opacity: 0;
    animation: flash 1 .9s linear both;
  }
  @keyframes flash { 0%, 32% { opacity: 0; } 37% { opacity: 1; } 46% { opacity: .25; }
                     52% { opacity: .6; } 100% { opacity: 0; } }

  /* สายฟ้าใหญ่กลางจอ — โผล่พร้อมวาบ ค้างเรืองแสงแล้วจางไป */
  .bolt {
    position: absolute; left: 50%; top: 205px; transform: translateX(-50%);
    filter: drop-shadow(0 0 26px #3ddcff) drop-shadow(0 0 70px rgba(61,220,255,.55));
    opacity: 0;
    animation: bolt 1 2.4s linear both;
  }
  @keyframes bolt { 0%, 31% { opacity: 0; } 34% { opacity: 1; } 42% { opacity: .55; }
                    48% { opacity: .95; } 74% { opacity: .5; } 100% { opacity: 0; } }

  /* วงแหวนคลื่นกระแทกขยายออกจากจุดที่ฟ้าผ่า */
  .ring {
    position: absolute; left: 50%; top: 44%; width: 60px; height: 60px;
    border: 4px solid rgba(61,220,255,.8); border-radius: 50%;
    animation: ring 1 1.5s cubic-bezier(.1,.6,.3,1) both; animation-delay: .34s;
    opacity: 0;
  }
  @keyframes ring { from { transform: translate(-50%,-50%) scale(.4); opacity: .95; }
                    to   { transform: translate(-50%,-50%) scale(16); opacity: 0; } }

  /* ชื่อแบรนด์โครเมียม — กระแทกเข้าหลังวาบ + แสงเลื่อนผ่านตัวอักษรวนไป */
  .brand {
    position: absolute; top: 41%; width: 100%; text-align: center;
    font-size: 120px; line-height: 1.08; letter-spacing: .02em;
    background: linear-gradient(120deg, #ffffff 22%, #bfe9ff 38%, #55759e 48%,
                                #f2faff 58%, #8fb3d8 78%, #ffffff 95%);
    background-size: 240% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 rgba(4,9,26,.95)) drop-shadow(0 14px 34px rgba(0,0,0,.65));
    animation: slam 1 .5s cubic-bezier(.2,1.5,.4,1) both, shine 3.6s linear infinite;
    animation-delay: .42s, .42s;
  }
  @keyframes slam { from { transform: scale(1.9); opacity: 0; }
                    to   { transform: scale(1);   opacity: 1; } }
  @keyframes shine { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  .sub {
    position: absolute; top: 55.5%; width: 100%; text-align: center;
    font-size: 46px; color: #3ddcff; letter-spacing: .34em; text-indent: .34em;
    text-shadow: 0 0 22px rgba(61,220,255,.65);
    animation: fadeUp 1 .55s ease-out both, breathe 2.8s ease-in-out infinite;
    animation-delay: .72s, .72s;
  }
  @keyframes fadeUp { from { transform: translateY(30px); opacity: 0; }
                      to   { transform: translateY(0); opacity: 1; } }
  @keyframes breathe { 0%,100% { text-shadow: 0 0 14px rgba(61,220,255,.45); }
                       50%     { text-shadow: 0 0 34px rgba(61,220,255,.95); } }

  .dot {
    position: absolute; border-radius: 50%; background: #3ddcff;
    box-shadow: 0 0 12px rgba(61,220,255,.85);
    bottom: -3%;
    animation: rise linear infinite;
  }
  @keyframes rise { from { transform: translate(0,0); } to { transform: translate(var(--dx), -204vh); } }
</style></head>
<body>
  <div id="dots"></div>
  <svg class="bolt" width="330" height="720" viewBox="0 0 120 260">
    <polyline points="78,0 44,96 76,104 22,214 60,120 30,112 66,0" fill="#bfeeff"/>
  </svg>
  <div class="ring"></div>
  <div class="flash"></div>
  <div class="brand">{{TITLE}}</div>
  <div class="sub">{{TAG}}</div>

<script>
  let s = 40041;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const box = document.getElementById("dots");
  for (let i = 0; i < 22; i++) {
    const d = document.createElement("div");
    d.className = "dot";
    const size = 3 + rnd() * 5;
    d.style.width = d.style.height = size.toFixed(1) + "px";
    d.style.left = (rnd() * 100).toFixed(2) + "%";
    d.style.opacity = (0.15 + rnd() * 0.45).toFixed(2);
    d.style.setProperty("--dx", ((rnd() - 0.5) * 200).toFixed(0) + "px");
    const dur = 7 + rnd() * 8;
    d.style.animationDuration = dur.toFixed(2) + "s";
    d.style.animationDelay = (-rnd() * dur).toFixed(2) + "s";
    box.appendChild(d);
  }
  // ไม่ส่งชื่อมา = ใช้ชื่อแบรนด์เต็ม
  const b = document.querySelector(".brand");
  if (!b.textContent.trim()) b.textContent = "DIVISION X";
  const sub = document.querySelector(".sub");
  if (!sub.textContent.trim()) sub.textContent = "CARD GAME";
</script>
</body></html>
