<!doctype html>
<!-- ฉากโชว์สินค้า — เวทีกราฟิกแบรนด์ (กรมท่า+ฟ้านีออน+สายฟ้า) สินค้าเป็นรูปถ่ายจริงลอยกลางเวที
     กติกาของ motion.py: อนิเมชันทั้งหมดเป็น CSS animation เท่านั้น (เข็มนาฬิกาถูกหมุนจากข้างนอก)
     และการสุ่มตำแหน่งใช้ PRNG seed คงที่ — เรนเดอร์ซ้ำต้องได้ภาพเดิมทุกเฟรม -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "SarabunDX"; src: url("{{FONT_BOLD}}"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body {
    font-family: "SarabunDX", sans-serif;
    background:
      radial-gradient(120% 75% at 50% 30%, #123063 0%, #0a1a3a 52%, #050d20 100%);
    position: relative;
  }

  /* ── ลำแสงเฉียงสองลำ ลอยช้า ๆ คนละทิศ — ให้พื้นหลัง "หายใจ" ── */
  .beam {
    position: absolute; width: 220%; height: 340px; left: -60%;
    background: linear-gradient(90deg, transparent,
                rgba(61,220,255,.10) 35%, rgba(61,220,255,.16) 50%,
                rgba(61,220,255,.10) 65%, transparent);
    filter: blur(48px);
    transform-origin: 50% 50%;
  }
  .beam.a { top: 16%; transform: rotate(-24deg); animation: beamA 7s ease-in-out infinite alternate; }
  .beam.b { top: 62%; transform: rotate(21deg);  animation: beamB 8.6s ease-in-out infinite alternate; }
  @keyframes beamA { from { transform: rotate(-24deg) translateX(-90px); opacity: .7; }
                     to   { transform: rotate(-24deg) translateX(110px); opacity: 1; } }
  @keyframes beamB { from { transform: rotate(21deg) translateX(120px); opacity: .9; }
                     to   { transform: rotate(21deg) translateX(-100px); opacity: .6; } }

  /* ── อนุภาคฟ้านีออนลอยขึ้น (ตำแหน่งถูกวางโดย JS seed คงที่) ── */
  .dot {
    position: absolute; border-radius: 50%;
    background: #3ddcff;
    box-shadow: 0 0 12px rgba(61,220,255,.85);
    bottom: -3%;
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--dx), -204vh) ; }
  }

  /* ── สายฟ้าแบรนด์ — วาบสั้น ๆ นาน ๆ ครั้ง คนละจังหวะกันสองเส้น ── */
  .bolt { position: absolute; opacity: 0; filter: drop-shadow(0 0 14px #3ddcff); }
  .bolt.l { left: 40px;  top: 190px; animation: flashL 5.2s steps(1) infinite; }
  .bolt.r { right: 44px; top: 980px; animation: flashR 6.8s steps(1) infinite; }
  @keyframes flashL { 0%, 83% { opacity: 0; } 84% { opacity: .95; } 86% { opacity: .25; }
                      88% { opacity: .7; } 90%, 100% { opacity: 0; } }
  @keyframes flashR { 0%, 64% { opacity: 0; } 65% { opacity: .9; } 67% { opacity: .2; }
                      69% { opacity: .6; } 71%, 100% { opacity: 0; } }

  /* ── สินค้า (รูปถ่ายจริง) — ลอย เอียงนิด แสงนีออนหายใจ + เงาพื้น ── */
  .stage { position: absolute; inset: 0; display: flex; align-items: center;
           justify-content: center; }
  .float { animation: float 3.4s ease-in-out infinite; }
  .tilt  { animation: tilt 4.6s ease-in-out infinite; }
  .product {
    max-width: 72%; max-height: 46%;
    filter: drop-shadow(0 34px 42px rgba(0,0,0,.55))
            drop-shadow(0 0 34px rgba(61,220,255,.38));
    animation: glow 2.6s ease-in-out infinite, enter .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes float { 0%,100% { transform: translateY(-12px); } 50% { transform: translateY(14px); } }
  @keyframes tilt  { 0%,100% { transform: rotate(-1.4deg); }  50% { transform: rotate(1.6deg); } }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 34px 42px rgba(0,0,0,.55))
                      drop-shadow(0 0 26px rgba(61,220,255,.30)); }
    50%     { filter: drop-shadow(0 34px 42px rgba(0,0,0,.55))
                      drop-shadow(0 0 52px rgba(61,220,255,.60)); }
  }
  @keyframes enter { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .ground {
    position: absolute; left: 50%; top: 71.5%; width: 620px; height: 90px;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(61,220,255,.34), transparent 70%);
    filter: blur(14px);
    animation: ground 2.6s ease-in-out infinite;
  }
  @keyframes ground { 0%,100% { opacity: .55; transform: translateX(-50%) scaleX(.92); }
                      50%     { opacity: 1;   transform: translateX(-50%) scaleX(1.06); } }

  /* ── พาดชื่อ + ป้ายกำกับ — วิ่งเข้าตอนต้นฉากแล้วค้าง ── */
  .title {
    position: absolute; top: 176px; width: 100%; text-align: center;
    font-size: 92px; line-height: 1.15; padding: 0 70px;
    background: linear-gradient(180deg, #ffffff 18%, #bfe9ff 42%, #5f7fa8 50%,
                                #eaf7ff 58%, #8fb3d8 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(5,13,32,.9)) drop-shadow(0 10px 26px rgba(0,0,0,.6));
    animation: up .55s cubic-bezier(.2,1.2,.4,1) both; animation-delay: .22s;
  }
  .tag {
    position: absolute; top: 330px; width: 100%; text-align: center;
    animation: up .5s cubic-bezier(.2,1.2,.4,1) both; animation-delay: .5s;
  }
  .tag span {
    display: inline-block; font-size: 44px; color: #3ddcff;
    border: 3px solid rgba(61,220,255,.85);
    border-radius: 999px; padding: 10px 38px;
    background: rgba(8,18,40,.72);
    box-shadow: 0 0 24px rgba(61,220,255,.35), inset 0 0 18px rgba(61,220,255,.12);
  }
  @keyframes up { from { transform: translateY(46px); opacity: 0; }
                  to   { transform: translateY(0);    opacity: 1; } }
</style></head>
<body>
  <div class="beam a"></div>
  <div class="beam b"></div>
  <div id="dots"></div>

  <svg class="bolt l" width="120" height="260" viewBox="0 0 120 260">
    <polyline points="78,0 44,96 76,104 22,214 60,120 30,112 66,0"
              fill="rgba(61,220,255,.9)"/>
  </svg>
  <svg class="bolt r" width="100" height="220" viewBox="0 0 120 260">
    <polyline points="78,0 44,96 76,104 22,214 60,120 30,112 66,0"
              fill="rgba(61,220,255,.85)"/>
  </svg>

  <div class="ground"></div>
  <div class="stage"><div class="float"><div class="tilt">
    <img class="product" src="{{IMG}}" alt="">
  </div></div></div>

  <div class="title">{{TITLE}}</div>
  <div class="tag"><span>{{TAG}}</span></div>

<script>
  // อนุภาค 26 เม็ด — mulberry32 seed คงที่ ห้าม Math.random (เฟรมต้อง deterministic)
  let s = 20260910;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const box = document.getElementById("dots");
  for (let i = 0; i < 26; i++) {
    const d = document.createElement("div");
    d.className = "dot";
    const size = 3 + rnd() * 5;
    d.style.width = d.style.height = size.toFixed(1) + "px";
    d.style.left = (rnd() * 100).toFixed(2) + "%";
    d.style.opacity = (0.16 + rnd() * 0.5).toFixed(2);
    d.style.setProperty("--dx", ((rnd() - 0.5) * 220).toFixed(0) + "px");
    const dur = 7 + rnd() * 9;
    d.style.animationDuration = dur.toFixed(2) + "s";
    d.style.animationDelay = (-rnd() * dur).toFixed(2) + "s";
    box.appendChild(d);
  }
  // ช่องข้อความว่าง = ไม่ใช้ — ซ่อนไปเลย ไม่ทิ้งกรอบเปล่าค้างบนจอ
  for (const sel of [".title", ".tag"]) {
    const el = document.querySelector(sel);
    if (!el.textContent.trim()) el.style.display = "none";
  }
  // ยังไม่ได้เลือกรูปสินค้า (คนเพิ่งสลับมาใช้ฉากนี้ในห้องตัดต่อ) — ซ่อนไว้ก่อน
  // ดีกว่าโชว์ไอคอนรูปแตกกลางเวที
  const prod = document.querySelector(".product");
  if (!prod.getAttribute("src")) {
    prod.style.display = "none";
    document.querySelector(".ground").style.display = "none";
  }
</script>
</body></html>
